<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Windows 11 | POWER.bet Edition</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: #0a0c12;
      font-family: 'Segoe UI', system-ui, -apple-system, 'Roboto', sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      position: fixed;
    }

    /* DESKTOP */
    .desktop {
      width: 100%;
      height: 100%;
      position: relative;
      background: radial-gradient(ellipse at 30% 20%, #1a1f2e, #0a0c16);
      overflow: hidden;
    }

    /* Wallpaper com efeito power */
    .wallpaper {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      opacity: 0.4;
      pointer-events: none;
    }

    /* Ícones da área de trabalho */
    .desktop-icons {
      position: absolute;
      top: 20px;
      left: 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      z-index: 10;
    }

    .desktop-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 72px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      border-radius: 14px;
      padding: 8px 4px;
      cursor: pointer;
      transition: 0.1s;
      border: 0.5px solid rgba(255, 255, 255, 0.15);
    }

    .desktop-icon:active {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(0.96);
    }

    .desktop-icon img {
      width: 40px;
      height: 40px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .desktop-icon span {
      color: white;
      font-size: 11px;
      margin-top: 6px;
      text-shadow: 0 1px 2px black;
      font-weight: 500;
    }

    /* TASKBAR - estilo power */
    .taskbar {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      background: rgba(18, 22, 35, 0.85);
      backdrop-filter: blur(28px);
      border-radius: 28px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 1000;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.2), 0 8px 24px rgba(0,0,0,0.4);
      border: 1px solid rgba(0, 255, 255, 0.3);
    }

    .start-btn {
      background: linear-gradient(135deg, rgba(0, 200, 255, 0.2), rgba(0, 100, 255, 0.3));
      border-radius: 20px;
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: 0.1s;
      border: 0.5px solid cyan;
    }

    .start-btn:active {
      transform: scale(0.95);
      background: linear-gradient(135deg, cyan, #0066ff);
    }

    .start-btn svg {
      width: 20px;
      fill: cyan;
    }

    .start-btn span {
      color: cyan;
      font-weight: bold;
      font-size: 14px;
      text-shadow: 0 0 3px cyan;
    }

    .taskbar-middle {
      display: flex;
      gap: 12px;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 24px;
      border-radius: 40px;
    }

    .taskbar-app {
      width: 44px;
      height: 44px;
      background: rgba(0, 255, 255, 0.1);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.1s;
      border: 0.5px solid rgba(0, 255, 255, 0.4);
    }

    .taskbar-app:active {
      background: rgba(0, 255, 255, 0.4);
      transform: scale(0.92);
    }

    .taskbar-app img {
      width: 24px;
      height: 24px;
    }

    .time-battery {
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 16px;
      border-radius: 28px;
      color: cyan;
      font-size: 14px;
      font-weight: bold;
      font-family: monospace;
      letter-spacing: 1px;
      box-shadow: 0 0 5px rgba(0, 255, 255, 0.3);
    }

    /* START MENU POWER */
    .start-menu {
      position: absolute;
      bottom: 80px;
      left: 16px;
      width: 460px;
      max-width: calc(100% - 32px);
      background: rgba(12, 16, 28, 0.95);
      backdrop-filter: blur(40px);
      border-radius: 32px;
      padding: 20px 16px;
      z-index: 1100;
      transition: 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      transform-origin: bottom left;
      border: 1px solid cyan;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
    }

    .start-menu.hide {
      transform: scale(0.9);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-bottom: 16px;
      border-bottom: 1px solid cyan;
      margin-bottom: 18px;
    }

    .avatar {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, cyan, #0066ff);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      color: #0a0c16;
    }

    .apps-power {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }

    .power-app {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: rgba(0, 255, 255, 0.08);
      border-radius: 20px;
      padding: 12px 4px;
      cursor: pointer;
      transition: 0.1s;
    }

    .power-app:active {
      background: rgba(0, 255, 255, 0.3);
    }

    .power-app img {
      width: 36px;
      height: 36px;
    }

    .power-app span {
      color: #ccf;
      font-size: 11px;
    }

    /* MICROSOFT STORE */
    .store-panel {
      position: absolute;
      top: 8%;
      left: 5%;
      width: 90%;
      height: 84%;
      background: rgba(10, 14, 26, 0.96);
      backdrop-filter: blur(32px);
      border-radius: 36px;
      z-index: 1200;
      border: 2px solid cyan;
      box-shadow: 0 0 40px rgba(0, 255, 255, 0.3);
      display: flex;
      flex-direction: column;
      transition: 0.2s;
    }

    .store-panel.hide-store {
      transform: scale(0.8);
      opacity: 0;
      visibility: hidden;
    }

    .store-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 24px;
      background: rgba(0, 0, 0, 0.5);
      border-bottom: 1px solid cyan;
    }

    .store-header h2 {
      color: cyan;
      font-weight: bold;
    }

    .close-btn {
      background: rgba(255, 0, 100, 0.6);
      border: none;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 30px;
      font-size: 24px;
      cursor: pointer;
    }

    .store-grid {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 20px;
    }

    .store-card {
      background: rgba(0, 255, 255, 0.1);
      border-radius: 24px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
    }

    .store-card:active {
      background: rgba(0, 255, 255, 0.3);
    }

    .store-card img {
      width: 70px;
      height: 70px;
      border-radius: 20px;
    }

    .install-power {
      margin-top: 10px;
      background: linear-gradient(90deg, cyan, #0066ff);
      border: none;
      padding: 8px 16px;
      border-radius: 30px;
      color: #000;
      font-weight: bold;
    }

    /* CONFIGURAÇÕES */
    .settings-panel {
      position: absolute;
      top: 15%;
      left: 10%;
      width: 80%;
      background: #11151fdd;
      backdrop-filter: blur(30px);
      border-radius: 32px;
      z-index: 1200;
      padding: 24px;
      border: 1px solid cyan;
    }

    .settings-panel.hide {
      display: none;
    }

    .toast {
      position: absolute;
      bottom: 90px;
      right: 16px;
      background: #000000cc;
      backdrop-filter: blur(20px);
      padding: 12px 24px;
      border-radius: 40px;
      color: cyan;
      font-weight: bold;
      z-index: 1300;
      transition: 0.2s;
      border-left: 5px solid cyan;
      pointer-events: none;
    }
  </style>
</head>
<body>
<div class="desktop">
  <!-- Wallpaper -->
  <div class="wallpaper" style="background: url('https://images.pexels.com/photos/956999/microsoft-windows-build-msi-956999.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2') center/cover no-repeat;"></div>

  <div class="desktop-icons">
    <div class="desktop-icon" id="storeDesktopBtn">
      <img src="https://cdn-icons-png.flaticon.com/512/5968/5968705.png" alt="store">
      <span>Microsoft Store</span>
    </div>
    <div class="desktop-icon" id="settingsDesktopBtn">
      <img src="https://cdn-icons-png.flaticon.com/512/2997/2997933.png" alt="settings">
      <span>Configurações</span>
    </div>
  </div>

  <div class="taskbar">
    <div class="start-btn" id="startPowerBtn">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 4h16v16H4z" fill="currentColor"/><rect x="8" y="8" width="3" height="3" fill="#000"/><rect x="13" y="8" width="3" height="3" fill="#000"/><rect x="8" y="13" width="3" height="3" fill="#000"/><rect x="13" y="13" width="3" height="3" fill="#000"/></svg>
      <span>POWER START</span>
    </div>
    <div class="taskbar-middle">
      <div class="taskbar-app" id="storeTaskBtn">
        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968705.png" alt="store">
      </div>
      <div class="taskbar-app" id="settingsTaskBtn">
        <img src="https://cdn-icons-png.flaticon.com/512/2997/2997933.png" alt="settings">
      </div>
    </div>
    <div class="time-battery" id="powerClock">--:--</div>
  </div>

  <!-- START MENU -->
  <div class="start-menu hide" id="powerStartMenu">
    <div class="user-area">
      <div class="avatar">⚡</div>
      <div style="color: white;">Hyper-Droid | POWER.bet</div>
    </div>
    <div class="apps-power">
      <div class="power-app" data-app="store"><img src="https://cdn-icons-png.flaticon.com/512/5968/5968705.png"><span>Store</span></div>
      <div class="power-app" data-app="settings"><img src="https://cdn-icons-png.flaticon.com/512/2997/2997933.png"><span>Settings</span></div>
      <div class="power-app" data-app="edge"><img src="https://cdn-icons-png.flaticon.com/512/732/732221.png"><span>Edge</span></div>
      <div class="power-app" data-app="game"><img src="https://cdn-icons-png.flaticon.com/512/1067/1067566.png"><span>Game Pass</span></div>
    </div>
  </div>

  <!-- STORE PANEL -->
  <div class="store-panel hide-store" id="storePowerPanel">
    <div class="store-header">
      <h2>📀 Microsoft Store POWER</h2>
      <button class="close-btn" id="closePowerStore">✕</button>
    </div>
    <div class="store-grid" id="powerStoreGrid"></div>
  </div>

  <!-- SETTINGS -->
  <div class="settings-panel hide" id="powerSettings">
    <div style="display: flex; justify-content: space-between;">
      <h3 style="color: cyan;">⚙️ POWER Config</h3>
      <button id="closePowerSettings" style="background:red; border:none; color:white; width:36px; border-radius:30px;">✕</button>
    </div>
    <div style="margin-top: 20px; color: white;">
      <p>✅ Windows 11 Hyper-Droid</p>
      <p>✅ Modo POWER.bet: ATIVADO</p>
      <p>✅ RGB Neon: ON</p>
      <button id="toastPowerTest" style="margin-top: 20px; background:cyan; border:none; padding:10px; border-radius:20px;">🔔 Testar Notificação</button>
    </div>
  </div>

  <div class="toast" id="powerToast" style="opacity:0;">✔️ Ação concluída</div>
</div>

<script>
  // Elementos
  const startBtn = document.getElementById('startPowerBtn');
  const startMenu = document.getElementById('powerStartMenu');
  const storePanel = document.getElementById('storePowerPanel');
  const settingsPanel = document.getElementById('powerSettings');
  const toast = document.getElementById('powerToast');
  
  function showToast(msg, duration = 2000) {
    toast.style.opacity = '1';
    toast.innerText = msg;
    setTimeout(() => {
      toast.style.opacity = '0';
    }, duration);
  }
  
  function closeAll() {
    storePanel.classList.add('hide-store');
    settingsPanel.classList.add('hide');
  }
  
  function openStore() {
    closeAll();
    storePanel.classList.remove('hide-store');
    startMenu.classList.add('hide');
    renderStoreApps();
  }
  
  function openSettings() {
    closeAll();
    settingsPanel.classList.remove('hide');
    startMenu.classList.add('hide');
  }
  
  // Aplicativos da loja
  const appsList = [
    { name: "Hyper Terminal", icon: "https://cdn-icons-png.flaticon.com/512/2997/2997922.png", desc: "Terminal Power" },
    { name: "Droid Launcher", icon: "https://cdn-icons-png.flaticon.com/512/906/906344.png", desc: "Launcher Hyper" },
    { name: "Game Booster", icon: "https://cdn-icons-png.flaticon.com/512/1067/1067566.png", desc: "Acelera Games" },
    { name: "RGB Control", icon: "https://cdn-icons-png.flaticon.com/512/3691/3691446.png", desc: "Led Sync" },
    { name: "Windows Defender", icon: "https://cdn-icons-png.flaticon.com/512/886/886668.png", desc: "Proteção Máxima" },
    { name: "POWER.bet Hub", icon: "https://cdn-icons-png.flaticon.com/512/1055/1055687.png", desc: "Central Gamer" }
  ];
  
  function renderStoreApps() {
    const container = document.getElementById('powerStoreGrid');
    if (!container) return;
    container.innerHTML = '';
    appsList.forEach(app => {
      const card = document.createElement('div');
      card.className = 'store-card';
      card.innerHTML = `
        <img src="${app.icon}"><h4 style="color:white;">${app.name}</h4><p style="color:#aaa;">${app.desc}</p>
        <button class="install-power">Instalar</button>
      `;
      card.querySelector('.install-power').addEventListener('click', (e) => {
        e.stopPropagation();
        showToast(`⚡ Instalando ${app.name}...`);
        setTimeout(() => showToast(`✅ ${app.name} instalado com sucesso!`), 1000);
      });
      container.appendChild(card);
    });
  }
  
  // Eventos
  startBtn.addEventListener('click', () => {
    if (startMenu.classList.contains('hide')) {
      closeAll();
      startMenu.classList.remove('hide');
    } else {
      startMenu.classList.add('hide');
    }
  });
  
  document.getElementById('storeTaskBtn').addEventListener('click', openStore);
  document.getElementById('settingsTaskBtn').addEventListener('click', openSettings);
  document.getElementById('storeDesktopBtn').addEventListener('click', openStore);
  document.getElementById('settingsDesktopBtn').addEventListener('click', openSettings);
  document.getElementById('closePowerStore').addEventListener('click', () => {
    storePanel.classList.add('hide-store');
  });
  document.getElementById('closePowerSettings').addEventListener('click', () => {
    settingsPanel.classList.add('hide');
  });
  document.getElementById('toastPowerTest')?.addEventListener('click', () => {
    showToast('🔔 Modo POWER.bet ativado | Windows 11 pronto!');
  });
  
  // Apps do menu start
  document.querySelectorAll('.power-app').forEach(app => {
    app.addEventListener('click', (e) => {
      const appName = app.getAttribute('data-app');
      if (appName === 'store') openStore();
      else if (appName === 'settings') openSettings();
      else if (appName === 'edge') showToast('🌐 Microsoft Edge abrindo...');
      else if (appName === 'game') showToast('🎮 Game Pass: Biblioteca de jogos disponível!');
      startMenu.classList.add('hide');
    });
  });
  
  // Relógio
  function updatePowerClock() {
    const now = new Date();
    const hours = now.getHours().toString().padStart(2, '0');
    const minutes = now.getMinutes().toString().padStart(2, '0');
    document.getElementById('powerClock').innerText = `${hours}:${minutes}`;
  }
  setInterval(updatePowerClock, 1000);
  updatePowerClock();
  
  // Fechar menu ao clicar fora
  document.addEventListener('click', (e) => {
    if (!startMenu.contains(e.target) && !startBtn.contains(e.target) && !startMenu.classList.contains('hide')) {
      startMenu.classList.add('hide');
    }
  });
  
  renderStoreApps();
  showToast('⚡ Windows 11 POWER.bet | Todos os botões funcionam!', 2500);
</script>
</body>
</html>
