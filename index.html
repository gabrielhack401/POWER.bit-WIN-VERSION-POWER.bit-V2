<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Fusion OS - POWER.bit</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #0a0c12;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      position: fixed;
    }

    /* Desktop */
    .desktop {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 30% 20%, #0f1420, #05070c);
      position: relative;
      overflow: hidden;
    }

    /* Status Bar */
    .status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 45px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(15px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      color: cyan;
      font-family: monospace;
      z-index: 100;
      border-bottom: 1px solid cyan;
      font-size: 13px;
    }

    /* Dock */
    .dock {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,255,255,0.15);
      backdrop-filter: blur(20px);
      border-radius: 40px;
      padding: 8px 20px;
      display: flex;
      gap: 15px;
      z-index: 100;
      border: 1px solid cyan;
    }

    .dock-icon {
      width: 55px;
      height: 55px;
      background: rgba(0,255,255,0.15);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.1s;
    }

    .dock-icon:active {
      transform: scale(0.92);
      background: rgba(0,255,255,0.5);
    }

    .dock-icon img {
      width: 32px;
      height: 32px;
      pointer-events: none;
    }

    /* Start Button */
    .start-btn {
      position: absolute;
      bottom: 25px;
      left: 20px;
      background: rgba(0,255,255,0.2);
      backdrop-filter: blur(15px);
      border-radius: 30px;
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      border: 1px solid cyan;
      z-index: 100;
    }

    .start-btn:active {
      transform: scale(0.96);
      background: rgba(0,255,255,0.4);
    }

    .start-btn span {
      color: cyan;
      font-weight: bold;
      font-size: 13px;
    }

    /* Start Menu */
    .start-menu {
      position: absolute;
      bottom: 90px;
      left: 20px;
      width: 300px;
      background: rgba(10,15,25,0.96);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 15px;
      border: 1px solid cyan;
      z-index: 200;
    }

    .start-menu.hide {
      display: none;
    }

    .menu-header {
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid cyan;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .avatar {
      width: 45px;
      height: 45px;
      background: linear-gradient(135deg, cyan, #0066ff);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .apps-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .menu-app {
      background: rgba(0,255,255,0.08);
      border-radius: 14px;
      padding: 8px 4px;
      text-align: center;
      cursor: pointer;
    }

    .menu-app:active {
      background: rgba(0,255,255,0.3);
    }

    .menu-app span {
      color: cyan;
      font-size: 11px;
      display: block;
      margin-top: 4px;
    }

    /* Janela */
    .window {
      position: absolute;
      background: #0e121fe8;
      backdrop-filter: blur(25px);
      border-radius: 20px;
      border: 1.5px solid cyan;
      box-shadow: 0 0 20px cyan;
      display: flex;
      flex-direction: column;
      z-index: 300;
      width: 85%;
      max-width: 400px;
      height: auto;
      max-height: 70vh;
      left: 7.5%;
      top: 15%;
    }

    .window.hide {
      display: none;
    }

    .window-bar {
      background: #000000aa;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid cyan;
      border-radius: 20px 20px 0 0;
    }

    .window-title {
      color: cyan;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .window-controls {
      display: flex;
      gap: 8px;
    }

    .win-close, .win-min {
      width: 28px;
      height: 28px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
    }

    .win-close { background: #ff3366; }
    .win-min { background: #ffaa33; }

    .window-content {
      flex: 1;
      padding: 15px;
      overflow: auto;
    }

    iframe {
      width: 100%;
      height: 300px;
      border: none;
      border-radius: 12px;
      background: white;
    }

    .toast {
      position: absolute;
      bottom: 100px;
      left: 20px;
      right: 20px;
      background: cyan;
      color: black;
      padding: 10px;
      border-radius: 50px;
      text-align: center;
      font-weight: bold;
      z-index: 500;
      transition: 0.2s;
    }

    button {
      background: cyan;
      border: none;
      padding: 10px;
      border-radius: 25px;
      font-weight: bold;
      margin: 5px 0;
      width: 100%;
    }

    input {
      background: #1a1e2a;
      border: 1px solid cyan;
      color: white;
      padding: 8px;
      border-radius: 20px;
      width: 100%;
    }
  </style>
</head>
<body>
<div class="desktop">
  <div class="status-bar">
    <span>⚡ FUSION OS ULTRA</span>
    <span id="clock">--:--:--</span>
    <span id="battery">🔋 --%</span>
  </div>

  <div class="start-btn" id="startBtn">
    <span>❖</span>
    <span>INICIAR</span>
  </div>

  <div class="dock" id="dock"></div>

  <div class="start-menu hide" id="startMenu">
    <div class="menu-header">
      <div class="avatar">⚡</div>
      <div><strong style="color:cyan;">POWER.bit</strong><br><span style="font-size:10px;">Fusion OS</span></div>
    </div>
    <div class="apps-list" id="appsList"></div>
  </div>

  <div class="toast" id="toast" style="opacity:0;">✅</div>
</div>

<script>
  // APPS
  const APPS = [
    { id: "chrome", nome: "Chrome", icone: "https://cdn-icons-png.flaticon.com/512/6124/6124999.png", url: "https://www.google.com" },
    { id: "youtube", nome: "YouTube", icone: "https://cdn-icons-png.flaticon.com/512/1384/1384060.png", url: "https://www.youtube.com/embed?listType=search&query=windows" },
    { id: "whatsapp", nome: "WhatsApp", icone: "https://cdn-icons-png.flaticon.com/512/124/124034.png", url: "https://web.whatsapp.com" },
    { id: "instagram", nome: "Instagram", icone: "https://cdn-icons-png.flaticon.com/512/2111/2111463.png", url: "https://www.instagram.com" },
    { id: "gmail", nome: "Gmail", icone: "https://cdn-icons-png.flaticon.com/512/5968/5968534.png", url: "https://mail.google.com" },
    { id: "maps", nome: "Maps", icone: "https://cdn-icons-png.flaticon.com/512/854/854878.png", url: "https://www.google.com/maps/embed?pb=!1m18" },
    { id: "spotify", nome: "Spotify", icone: "https://cdn-icons-png.flaticon.com/512/2111/2111624.png", url: "https://open.spotify.com/embed/playlist/37i9dQZF1DXcBWIGoYBM5M" }
  ];

  let janelaAtual = null;

  function mostrarToast(msg) {
    const toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.style.opacity = '1';
    setTimeout(() => toast.style.opacity = '0', 2000);
  }

  function fecharTodasJanelas() {
    if (janelaAtual) {
      janelaAtual.remove();
      janelaAtual = null;
    }
  }

  function criarJanela(titulo, iconeUrl, conteudo) {
    fecharTodasJanelas();
    const desktop = document.querySelector('.desktop');
    const win = document.createElement('div');
    win.className = 'window';
    win.innerHTML = `
      <div class="window-bar">
        <div class="window-title"><img src="${iconeUrl}" width="18"> ${titulo}</div>
        <div class="window-controls">
          <div class="win-min">─</div>
          <div class="win-close">✕</div>
        </div>
      </div>
      <div class="window-content">${conteudo}</div>
    `;
    desktop.appendChild(win);
    janelaAtual = win;

    win.querySelector('.win-close').onclick = () => { win.remove(); janelaAtual = null; };
    win.querySelector('.win-min').onclick = () => win.classList.toggle('hide');

    // Arrastar
    const bar = win.querySelector('.window-bar');
    let arrastando = false, startX, startY, startLeft, startTop;
    bar.onmousedown = (e) => { arrastando = true; startX = e.clientX; startY = e.clientY; startLeft = win.offsetLeft; startTop = win.offsetTop; };
    document.onmousemove = (e) => { if(arrastando) { win.style.left = (startLeft + e.clientX - startX) + 'px'; win.style.top = (startTop + e.clientY - startY) + 'px'; } };
    document.onmouseup = () => arrastando = false;
    bar.ontouchstart = (e) => { arrastando = true; startX = e.touches[0].clientX; startY = e.touches[0].clientY; startLeft = win.offsetLeft; startTop = win.offsetTop; };
    document.ontouchmove = (e) => { if(arrastando) { win.style.left = (startLeft + e.touches[0].clientX - startX) + 'px'; win.style.top = (startTop + e.touches[0].clientY - startY) + 'px'; } };
    document.ontouchend = () => arrastando = false;
  }

  function abrirApp(appId) {
    const app = APPS.find(a => a.id === appId);
    if (!app) return;
    criarJanela(app.nome, app.icone, `<iframe src="${app.url}" title="${app.nome}"></iframe>`);
    mostrarToast(`📂 Abrindo ${app.nome}`);
    document.getElementById('startMenu').classList.add('hide');
  }

  // Relógio
  function atualizarRelogio() {
    document.getElementById('clock').innerText = new Date().toLocaleTimeString();
  }
  setInterval(atualizarRelogio, 1000);
  atualizarRelogio();

  // Bateria
  if ('getBattery' in navigator) {
    navigator.getBattery().then(b => {
      function att() { document.getElementById('battery').innerText = `${b.charging ? '⚡' : '🔋'} ${Math.floor(b.level*100)}%`; }
      att();
      b.addEventListener('levelchange', att);
      b.addEventListener('chargingchange', att);
    });
  } else {
    document.getElementById('battery').innerText = '🔋 85%';
  }

  // Renderizar Dock
  const dockApps = ['chrome', 'youtube', 'whatsapp', 'instagram', 'gmail'];
  const dockDiv = document.getElementById('dock');
  dockDiv.innerHTML = dockApps.map(id => {
    const app = APPS.find(a => a.id === id);
    return `<div class="dock-icon" data-app="${app.id}"><img src="${app.icone}"></div>`;
  }).join('');
  document.querySelectorAll('.dock-icon').forEach(el => {
    el.onclick = () => abrirApp(el.dataset.app);
  });

  // Renderizar Menu Iniciar
  const appsDiv = document.getElementById('appsList');
  appsDiv.innerHTML = APPS.map(app => `
    <div class="menu-app" data-app="${app.id}">
      <img src="${app.icone}" width="28"><br>
      <span>${app.nome}</span>
    </div>
  `).join('');
  document.querySelectorAll('.menu-app').forEach(el => {
    el.onclick = () => abrirApp(el.dataset.app);
  });

  // Botão Iniciar
  document.getElementById('startBtn').onclick = () => {
    document.getElementById('startMenu').classList.toggle('hide');
  };

  // Fechar menu ao clicar fora
  document.addEventListener('click', (e) => {
    const menu = document.getElementById('startMenu');
    const btn = document.getElementById('startBtn');
    if (!menu.contains(e.target) && !btn.contains(e.target) && !menu.classList.contains('hide')) {
      menu.classList.add('hide');
    }
  });

  mostrarToast('✅ Fusion OS pronto! Toque nos ícones');
</script>
</body>
</html>
