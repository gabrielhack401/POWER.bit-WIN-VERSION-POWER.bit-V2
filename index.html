<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Windows 12 Hyper-Version | Todos os Botões Funcionam</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #05070c;
      font-family: 'Segoe UI', system-ui, 'Roboto', sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      position: fixed;
    }

    .desktop {
      width: 100%;
      height: 100%;
      position: relative;
      background: radial-gradient(ellipse at 40% 30%, #121828, #05070c);
      overflow: hidden;
    }

    .wallpaper {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      opacity: 0.4;
      pointer-events: none;
    }

    /* Desktop Icons */
    .desktop-icons {
      position: absolute;
      top: 20px;
      left: 16px;
      right: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      z-index: 10;
    }

    .desktop-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 70px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 8px 4px;
      cursor: pointer;
      transition: 0.1s;
      border: 0.5px solid rgba(0, 200, 255, 0.4);
    }

    .desktop-icon:active {
      background: rgba(0, 200, 255, 0.3);
      transform: scale(0.96);
    }

    .desktop-icon img {
      width: 36px;
      height: 36px;
      pointer-events: none;
    }

    .desktop-icon span {
      color: white;
      font-size: 10px;
      margin-top: 5px;
      text-shadow: 0 1px 2px black;
      pointer-events: none;
    }

    /* Taskbar */
    .taskbar {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      background: rgba(12, 18, 28, 0.94);
      backdrop-filter: blur(32px);
      border-radius: 32px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 1000;
      border: 1px solid rgba(0, 200, 255, 0.5);
      box-shadow: 0 0 12px rgba(0, 200, 255, 0.2);
    }

    .start-btn {
      background: linear-gradient(135deg, #00aaff22, #0066cc44);
      border-radius: 24px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      border: 0.5px solid cyan;
    }
    .start-btn:active { transform: scale(0.95); background: rgba(0, 200, 255, 0.4); }
    .start-btn svg { width: 18px; fill: cyan; pointer-events: none; }
    .start-btn span { color: cyan; font-weight: bold; font-size: 12px; pointer-events: none; }

    .taskbar-middle {
      display: flex;
      gap: 10px;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px 16px;
      border-radius: 40px;
      overflow-x: auto;
      max-width: 55%;
    }

    .taskbar-app {
      width: 42px;
      height: 42px;
      background: rgba(0, 200, 255, 0.15);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .taskbar-app:active { background: rgba(0, 200, 255, 0.5); transform: scale(0.94); }
    .taskbar-app img { width: 24px; height: 24px; pointer-events: none; }

    .time-area {
      background: rgba(0, 0, 0, 0.6);
      padding: 5px 12px;
      border-radius: 28px;
      color: cyan;
      font-family: monospace;
      font-weight: bold;
      font-size: 13px;
      letter-spacing: 1px;
      white-space: nowrap;
      cursor: default;
    }

    /* Start Menu */
    .start-menu {
      position: absolute;
      bottom: 78px;
      left: 12px;
      right: 12px;
      background: rgba(10, 14, 24, 0.98);
      backdrop-filter: blur(48px);
      border-radius: 28px;
      padding: 16px;
      z-index: 1100;
      transition: 0.2s;
      border: 1px solid cyan;
      max-height: 70vh;
      overflow-y: auto;
    }
    .start-menu.hide { display: none; }

    .menu-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid cyan;
      margin-bottom: 16px;
    }
    .avatar-win12 {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, cyan, #0066ff);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .menu-header-text { color: white; font-size: 14px; }

    .apps-grid-full {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 16px;
    }
    .menu-app {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      background: rgba(0, 200, 255, 0.1);
      border-radius: 16px;
      padding: 8px 4px;
      cursor: pointer;
    }
    .menu-app:active { background: rgba(0, 200, 255, 0.3); }
    .menu-app img { width: 32px; height: 32px; pointer-events: none; }
    .menu-app span { color: #ccf; font-size: 10px; }

    /* Janelas */
    .app-window {
      position: absolute;
      top: 5%;
      left: 3%;
      width: 94%;
      height: 86%;
      background: #0f1320ee;
      backdrop-filter: blur(40px);
      border-radius: 28px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      border: 1px solid cyan;
      box-shadow: 0 0 30px rgba(0, 200, 255, 0.3);
    }
    .app-window.hide { display: none; }

    .win-header {
      background: #0a0e18cc;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid cyan;
      border-radius: 28px 28px 0 0;
    }
    .win-title {
      color: cyan;
      font-weight: bold;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .win-title img { width: 22px; height: 22px; }
    .close-win {
      background: #ff4444;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 30px;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }
    .win-content {
      flex: 1;
      overflow: auto;
      padding: 12px;
      color: white;
    }
    iframe { width: 100%; height: 100%; border: none; background: white; border-radius: 16px; }

    .internal-ui {
      background: #1a1e2c;
      border-radius: 24px;
      padding: 20px;
      text-align: center;
      height: 100%;
      overflow-y: auto;
    }

    .toast {
      position: absolute;
      bottom: 85px;
      left: 16px;
      right: 16px;
      background: #000000cc;
      backdrop-filter: blur(24px);
      padding: 10px 16px;
      border-radius: 40px;
      color: #00ffcc;
      text-align: center;
      z-index: 300;
      transition: 0.2s;
      font-size: 12px;
    }
  </style>
</head>

<script>
  // Toast
  const toast = document.getElementById('toastMsg');
  function showToast(msg, duration=2000) {
    toast.style.opacity = '1';
    toast.innerText = msg;
    setTimeout(() => toast.style.opacity = '0', duration);
  }

  // Fechar todas janelas
  function closeAllWindows() {
    document.querySelectorAll('.app-window').forEach(w => w.classList.add('hide'));
  }

  // Abrir janela específica
  function openWindow(windowId) {
    closeAllWindows();
    const win = document.getElementById(windowId);
    if (win) win.classList.remove('hide');
    document.getElementById('startMenu').classList.add('hide');
    showToast(`✅ Abrindo ${windowId.replace('Window', '')}...`, 1000);
  }

  // Abrir app baseado no tipo
  function openApp(appType) {
    if (appType === 'chrome') openWindow('chromeWindow');
    else if (appType === 'edge') openWindow('edgeWindow');
    else if (appType === 'store') {
      renderStore();
      openWindow('storeWindow');
    }
    else if (appType === 'spotify') openWindow('spotifyWindow');
    else if (appType === 'youtube') openWindow('youtubeWindow');
    else if (appType === 'calc') openWindow('calcWindow');
    else showToast(`📱 ${appType} abrindo...`);
  }

  // Renderizar Microsoft Store
  function renderStore() {
    const container = document.getElementById('storeContent');
    if (!container) return;
    container.innerHTML = `
      <div class="internal-ui">
        <h2 style="color:cyan;">📦 Microsoft Store</h2>
        <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:16px; margin-top:16px;">
          <div style="background:#252540; border-radius:20px; padding:12px; text-align:center;"><img src="https://cdn-icons-png.flaticon.com/512/870/870910.png" width="50"><h4>Netflix</h4><button class="install-store" data-app="Netflix" style="background:cyan; border:none; margin-top:8px; padding:6px 12px; border-radius:20px;">Instalar</button></div>
          <div style="background:#252540; border-radius:20px; padding:12px; text-align:center;"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" width="50"><h4>Instagram</h4><button class="install-store" data-app="Instagram" style="background:cyan; border:none; margin-top:8px; padding:6px 12px; border-radius:20px;">Instalar</button></div>
          <div style="background:#252540; border-radius:20px; padding:12px; text-align:center;"><img src="https://cdn-icons-png.flaticon.com/512/3046/3046126.png" width="50"><h4>TikTok</h4><button class="install-store" data-app="TikTok" style="background:cyan; border:none; margin-top:8px; padding:6px 12px; border-radius:20px;">Instalar</button></div>
        </div>
      </div>
    `;
    document.querySelectorAll('.install-store').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        showToast(`✅ ${btn.getAttribute('data-app')} instalado com sucesso!`);
      });
    });
  }

  // ========== RELÓGIO FUNCIONAL ==========
  function updateClock() {
    const now = new Date();
    const hours = now.getHours().toString().padStart(2, '0');
    const minutes = now.getMinutes().toString().padStart(2, '0');
    const seconds = now.getSeconds().toString().padStart(2, '0');
    const clockElement = document.getElementById('clock');
    if (clockElement) {
      clockElement.innerText = `${hours}:${minutes}:${seconds}`;
    }
  }
  setInterval(updateClock, 1000);
  updateClock();

  // ========== CALCULADORA ==========
  let calcValue = '0';
  let calcPrev = null;
  let calcOp = null;
  
  function updateCalcDisplay() {
    const display = document.getElementById('calcDisplayCalc');
    if (display) display.innerText = calcValue;
  }
  
  function attachCalcEvents() {
    document.querySelectorAll('.calc-num').forEach(btn => {
      btn.addEventListener('click', () => {
        const num = btn.getAttribute('data-num');
        calcValue = calcValue === '0' ? num : calcValue + num;
        updateCalcDisplay();
      });
    });
    document.querySelectorAll('.calc-op').forEach(btn => {
      btn.addEventListener('click', () => {
        calcPrev = parseFloat(calcValue);
        calcOp = btn.getAttribute('data-op');
        calcValue = '0';
      });
    });
    const clearBtn = document.getElementById('calcClear');
    if (clearBtn) {
      clearBtn.addEventListener('click', () => {
        calcValue = '0';
        calcPrev = null;
        calcOp = null;
        updateCalcDisplay();
      });
    }
    const equalBtn = document.getElementById('calcEqual');
    if (equalBtn) {
      equalBtn.addEventListener('click', () => {
        if (calcOp && calcPrev !== null) {
          const current = parseFloat(calcValue);
          let result = 0;
          if (calcOp === '+') result = calcPrev + current;
          else if (calcOp === '-') result = calcPrev - current;
          else if (calcOp === '*') result = calcPrev * current;
          else if (calcOp === '/') result = calcPrev / current;
          calcValue = result.toString();
          updateCalcDisplay();
          calcOp = null;
          calcPrev = null;
        }
      });
    }
  }

  // ========== EVENTOS DOS BOTÕES ==========
  
  // Botão Iniciar
  const startBtn = document.getElementById('startBtn');
  const startMenu = document.getElementById('startMenu');
  if (startBtn) {
    startBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      startMenu.classList.toggle('hide');
    });
  }

  // Fechar menu ao clicar fora
  document.addEventListener('click', (e) => {
    if (startMenu && !startMenu.contains(e.target) && !startBtn.contains(e.target) && !startMenu.classList.contains('hide')) {
      startMenu.classList.add('hide');
    }
  });

  // Fechar janelas com botão X
  document.querySelectorAll('.close-win').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const winId = btn.getAttribute('data-win');
      const win = document.getElementById(`${winId}Window`);
      if (win) win.classList.add('hide');
    });
  });

      font-weight: bold;

  </div>

  <div class="start-menu hide" id="startMenu">
    <div class="user-area"><div class="avatar">🪟</div><div style="color:white">Windows 11</div></div>
    <div class="apps-grid">
      <div class="app-item" data-app="chrome"><img src="https://cdn-icons-png.flaticon.com/512/6124/6124999.png"><span>Chrome</span></div>
      <div class="app-item" data-app="store"><img src="https://cdn-icons-png.flaticon.com/512/5968/5968705.png"><span>Microsoft Store</span></div>
      <div class="app-item" data-app="edge"><img src="https://cdn-icons-png.flaticon.com/512/732/732221.png"><span>Edge</span></div>
      <div class="app-item" data-app="calculator"><img src="https://cdn-icons-png.flaticon.com/512/3665/3665923.png"><span>Calculadora</span></div>
    </div>
  </div>

  <!-- Chrome Window (Navegador interno) -->
  <div class="window hide" id="chromeWindow">
    <div class="window-header"><div class="window-title"><img src="https://cdn-icons-png.flaticon.com/512/6124/6124999.png"> Google Chrome</div><button class="close-window" data-window="chrome">✕</button></div>
    <div class="window-content"><iframe src="https://www.google.com/webhp?igu=1" title="Chrome Browser"></iframe></div>
  </div>

  <!-- Edge Window -->
  <div class="window hide" id="edgeWindow">
    <div class="window-header"><div class="window-title"><img src="https://cdn-icons-png.flaticon.com/512/732/732221.png"> Microsoft Edge</div><button class="close-window" data-window="edge">✕</button></div>
    <div class="window-content"><iframe src="https://www.bing.com" title="Edge Browser"></iframe></div>
  </div>

  <!-- Microsoft Store Window (Loja interna com apps) -->
  <div class="window hide" id="storeWindow">
    <div class="window-header"><div class="window-title"><img src="https://cdn-icons-png.flaticon.com/512/5968/5968705.png"> Microsoft Store</div><button class="close-window" data-window="store">✕</button></div>
    <div class="window-content" id="storeContent"></div>
  </div>

  <div class="toast" id="toastMsg" style="opacity:0;">✅</div>
</div>

<script>
  // Lista de apps da loja interna
  const storeApps = [
    { name: "Chrome Browser", icon: "https://cdn-icons-png.flaticon.com/512/6124/6124999.png", desc: "Navegador Google" },
    { name: "Edge Browser", icon: "https://cdn-icons-png.flaticon.com/512/732/732221.png", desc: "Microsoft Edge" },
    { name: "Calculadora", icon: "https://cdn-icons-png.flaticon.com/512/3665/3665923.png", desc: "Calculadora Win11" },
    { name: "Spotify", icon: "https://cdn-icons-png.flaticon.com/512/2111/2111624.png", desc: "Música e podcasts" },
    { name: "YouTube", icon: "https://cdn-icons-png.flaticon.com/512/1384/1384060.png", desc: "Vídeos" },
    { name: "WhatsApp", icon: "https://cdn-icons-png.flaticon.com/512/124/124034.png", desc: "Mensagens" }
  ];

  const toast = document.getElementById('toastMsg');
  function showToast(msg, duration = 2000) {
    toast.style.opacity = '1';
    toast.innerText = msg;
    setTimeout(() => toast.style.opacity = '0', duration);
  }

  // Controle de janelas
  function closeAllWindows() {
    document.querySelectorAll('.window').forEach(w => w.classList.add('hide'));
  }

  function openWindow(windowId) {
    closeAllWindows();
    const win = document.getElementById(windowId);
    if (win) win.classList.remove('hide');
    document.getElementById('startMenu').classList.add('hide');
  }

  // Renderizar Microsoft Store interna
  function renderInternalStore() {
    const container = document.getElementById('storeContent');
    if (!container) return;
    container.innerHTML = `
      <div class="internal-store">
        <div class="store-header"><h2 style="color:cyan;">📦 Microsoft Store</h2><p style="color:#aaa;">Apps disponíveis para instalar</p></div>
        <div class="store-grid" id="storeGridInternal"></div>
      </div>
    `;
    const grid = document.getElementById('storeGridInternal');
    storeApps.forEach(app => {
      const card = document.createElement('div');
      card.className = 'store-card';
      card.innerHTML = `
        <img src="${app.icon}" alt="${app.name}">
        <h4>${app.name}</h4>
        <p style="color:#888; font-size:11px;">${app.desc}</p>
        <button class="install-internal" data-app="${app.name}">Instalar</button>
      `;
      const btn = card.querySelector('.install-internal');
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        showToast(`✅ ${app.name} foi instalado com sucesso!`);
      });
      grid.appendChild(card);
    });
  }

  // Eventos para abrir apps
  function openApp(appType) {
    if (appType === 'chrome') openWindow('chromeWindow');
    else if (appType === 'edge') openWindow('edgeWindow');
    else if (appType === 'store') {
      renderInternalStore();
      openWindow('storeWindow');
    } else if (appType === 'calculator') {
      showToast('🧮 Calculadora: 2 + 2 = 4 (simulação)');
    }
  }

  // Fechar janelas
  document.querySelectorAll('.close-window').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const winId = btn.getAttribute('data-window');
      const win = document.getElementById(`${winId}Window`);
      if (win) win.classList.add('hide');
    });
  });

  // Adicionar eventos a todos os elementos com data-app
  function bindAppEvents() {
    document.querySelectorAll('[data-app]').forEach(el => {
      el.addEventListener('click', (e) => {
        const app = el.getAttribute('data-app');
        openApp(app);
      });
    });
  }

  // Menu Iniciar
  const startBtn = document.getElementById('startBtn');
  const startMenu = document.getElementById('startMenu');
  startBtn.addEventListener('click', () => {
    startMenu.classList.toggle('hide');
  });

  // Fechar menu ao clicar fora
  document.addEventListener('click', (e) => {
    if (!startMenu.contains(e.target) && !startBtn.contains(e.target) && !startMenu.classList.contains('hide')) {
      startMenu.classList.add('hide');
    }
  });

  // Relógio
  function updateClock() {
    const now = new Date();
    const hours = now.getHours().toString().padStart(2, '0');
    const minutes = now.getMinutes().toString().padStart(2, '0');
    document.getElementById('clock').innerText = `${hours}:${minutes}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  bindAppEvents();
  showToast('✅ Windows 11 pronto! Clique no Chrome ou na Microsoft Store - TUDO ABRE DENTRO DA PÁGINA', 3500);
</script>
</body>
  </html>
