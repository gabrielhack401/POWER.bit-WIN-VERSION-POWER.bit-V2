<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CyberOS Fusion | Responsivo - Windows + Linux + Mac + iOS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #000;
      font-family: 'Segoe UI', 'Courier New', monospace;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      position: fixed;
    }
    .desktop {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 30%, #0a0f1f, #010105);
      position: relative;
      overflow: hidden;
    }
    /* Status bar responsiva */
    .status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: max(40px, env(safe-area-inset-top, 40px));
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 5%;
      color: #0ff;
      font-family: monospace;
      z-index: 100;
      border-bottom: 1px solid #0ff;
      font-weight: bold;
      font-size: clamp(10px, 4vw, 14px);
    }
    /* Dock responsivo - sempre centralizado */
    .dock {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,255,255,0.12);
      backdrop-filter: blur(20px);
      border-radius: 60px;
      padding: 8px 5%;
      display: flex;
      gap: clamp(8px, 4vw, 20px);
      z-index: 100;
      border: 1px solid #0ff;
      width: auto;
      max-width: 95%;
      overflow-x: auto;
      white-space: nowrap;
    }
    .dock-icon {
      width: clamp(45px, 12vw, 55px);
      height: clamp(45px, 12vw, 55px);
      background: rgba(0,255,255,0.2);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.1s;
      flex-shrink: 0;
    }
    .dock-icon:active { transform: scale(0.92); background: #0ff; }
    .dock-icon img { width: 60%; height: 60%; pointer-events: none; }
    /* Start menu responsivo */
    .start-menu {
      position: absolute;
      bottom: 85px;
      left: 5%;
      width: 90%;
      max-width: 320px;
      background: rgba(10,15,25,0.96);
      backdrop-filter: blur(24px);
      border-radius: 24px;
      padding: 16px;
      border: 1px solid #0ff;
      z-index: 200;
    }
    .start-menu.hide { display: none; }
    .menu-header {
      display: flex;
      gap: 12px;
      align-items: center;
      border-bottom: 1px solid #0ff;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .avatar {
      width: clamp(36px, 10vw, 48px);
      height: clamp(36px, 10vw, 48px);
      background: linear-gradient(135deg, #0ff, #0066ff);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(18px, 5vw, 24px);
    }
    .apps-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .menu-app {
      background: rgba(0,255,255,0.1);
      border-radius: 16px;
      padding: 8px 4px;
      text-align: center;
      cursor: pointer;
    }
    .menu-app:active { background: rgba(0,255,255,0.3); }
    .menu-app img { width: clamp(24px, 7vw, 32px); height: auto; }
    .menu-app span { color: #0ff; font-size: clamp(9px, 3vw, 11px); display: block; margin-top: 4px; }
    /* JANELAS RESPONSIVAS */
    .window {
      position: absolute;
      background: #0e121fe8;
      backdrop-filter: blur(28px);
      border-radius: 20px;
      border: 1.5px solid #0ff;
      box-shadow: 0 0 20px #0ff6;
      display: flex;
      flex-direction: column;
      z-index: 300;
      /* Tamanhos responsivos */
      width: 85% !important;
      max-width: 450px !important;
      min-width: 260px !important;
      height: auto !important;
      max-height: 70vh !important;
      min-height: 280px !important;
      left: 7.5% !important;
      top: 15% !important;
    }
    .window.hide { display: none; }
    .window-bar {
      background: #000000aa;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      cursor: grab;
      border-radius: 20px 20px 0 0;
      border-bottom: 1px solid #0ff;
    }
    .window-bar:active { cursor: grabbing; }
    .window-title {
      color: #0ff;
      font-weight: bold;
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: clamp(12px, 4vw, 14px);
    }
    .win-btn {
      width: 28px;
      height: 28px;
      border-radius: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin-left: 8px;
      font-weight: bold;
    }
    .close { background: #ff3366; color: white; }
    .min { background: #ffaa33; color: black; }
    .window-content {
      flex: 1;
      padding: 16px;
      overflow: auto;
      color: white;
      min-height: 200px;
    }
    iframe {
      width: 100%;
      height: 100%;
      min-height: 250px;
      border: none;
      background: white;
      border-radius: 12px;
    }
    /* Terminal responsivo */
    .terminal-body {
      background: #03060c;
      font-family: monospace;
      padding: 12px;
      border-radius: 16px;
      height: 100%;
      overflow-y: auto;
      border: 0.5px solid #0ff;
    }
    .terminal-line {
      color: #0f0;
      margin: 6px 0;
      font-size: clamp(10px, 3.5vw, 13px);
      word-break: break-word;
    }
    .terminal-input {
      background: #111;
      border: 1px solid #0ff;
      color: #0f0;
      width: 100%;
      padding: 8px;
      border-radius: 12px;
      font-family: monospace;
      font-size: clamp(11px, 3.5vw, 13px);
      margin-top: 8px;
    }
    /* Calculadora responsiva */
    .calc-display {
      background: #000;
      padding: 16px;
      text-align: right;
      font-size: clamp(28px, 8vw, 42px);
      margin-bottom: 16px;
      border-radius: 16px;
      border: 1px solid #0ff;
      word-break: break-all;
    }
    .calc-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .calc-btn {
      background: #0ff;
      text-align: center;
      padding: clamp(10px, 4vw, 14px);
      border-radius: 40px;
      font-weight: bold;
      font-size: clamp(16px, 5vw, 20px);
      cursor: pointer;
    }
    .calc-btn:active { background: white; transform: scale(0.95); }
    /* Store / Configurações responsivo */
    .store-btn, .config-item {
      background: rgba(0,255,255,0.2);
      border: none;
      padding: 12px;
      margin: 8px 0;
      border-radius: 24px;
      color: white;
      width: 100%;
      text-align: center;
      font-size: clamp(12px, 4vw, 14px);
    }
    .toast {
      position: absolute;
      bottom: 90px;
      left: 5%;
      right: 5%;
      width: 90%;
      background: #0ff;
      color: black;
      padding: 12px;
      border-radius: 60px;
      text-align: center;
      font-weight: bold;
      z-index: 500;
      transition: 0.2s;
      font-size: clamp(12px, 4vw, 14px);
    }
    /* Ajustes para landscape */
    @media (orientation: landscape) {
      .window {
        max-width: 500px !important;
        max-height: 80vh !important;
        left: calc(50% - 250px) !important;
        top: 10% !important;
      }
      .dock {
        gap: 15px;
        padding: 6px 3%;
      }
    }
  </style>
</head>
<body>
<div class="desktop">
  <div class="status-bar">
    <span>🌀 CYBER FUSION</span>
    <span id="liveClock">--:--:--</span>
    <span id="batteryDisplay">🔋 --%</span>
  </div>
  <div class="dock">
    <div class="dock-icon" data-app="chrome"><img src="https://cdn-icons-png.flaticon.com/512/6124/6124999.png" alt="Chrome"></div>
    <div class="dock-icon" data-app="terminal"><img src="https://cdn-icons-png.flaticon.com/512/2997/2997922.png" alt="Terminal"></div>
    <div class="dock-icon" data-app="store"><img src="https://cdn-icons-png.flaticon.com/512/5968/5968705.png" alt="Store"></div>
    <div class="dock-icon" data-app="settings"><img src="https://cdn-icons-png.flaticon.com/512/2997/2997933.png" alt="Settings"></div>
    <div class="dock-icon" data-app="calc"><img src="https://cdn-icons-png.flaticon.com/512/3665/3665923.png" alt="Calc"></div>
    <div class="dock-icon" data-app="finder"><img src="https://cdn-icons-png.flaticon.com/512/1828/1828970.png" alt="Finder"></div>
  </div>
  <div class="start-menu hide" id="startMenu">
    <div class="menu-header">
      <div class="avatar">🐧</div>
      <div style="color:white;">Fusion OS<br><span style="font-size:10px; color:#0ff;">Cyberpunk Edition</span></div>
    </div>
    <div class="apps-grid">
      <div class="menu-app" data-app="chrome"><img src="https://cdn-icons-png.flaticon.com/512/6124/6124999.png"><span>Chrome</span></div>
      <div class="menu-app" data-app="terminal"><img src="https://cdn-icons-png.flaticon.com/512/2997/2997922.png"><span>Terminal</span></div>
      <div class="menu-app" data-app="store"><img src="https://cdn-icons-png.flaticon.com/512/5968/5968705.png"><span>Store</span></div>
      <div class="menu-app" data-app="settings"><img src="https://cdn-icons-png.flaticon.com/512/2997/2997933.png"><span>Settings</span></div>
      <div class="menu-app" data-app="calc"><img src="https://cdn-icons-png.flaticon.com/512/3665/3665923.png"><span>Calc</span></div>
      <div class="menu-app" data-app="finder"><img src="https://cdn-icons-png.flaticon.com/512/1828/1828970.png"><span>Finder</span></div>
    </div>
  </div>
  <div class="toast" id="toastMsg" style="opacity:0;">✅</div>
</div>

<script>
  // ========== TOAST ==========
  const toast = document.getElementById('toastMsg');
  function showToast(msg) {
    toast.innerText = msg;
    toast.style.opacity = '1';
    setTimeout(() => toast.style.opacity = '0', 2000);
  }

  // ========== FECHAR TODAS JANELAS ==========
  function closeAllWindows() {
    document.querySelectorAll('.window').forEach(w => w.remove());
  }

  // ========== CRIAR JANELA RESPONSIVA (COM ARRASTO) ==========
  let currentZ = 500;
  function createWindow(title, iconUrl, contentHtml) {
    closeAllWindows();
    const desktop = document.querySelector('.desktop');
    const win = document.createElement('div');
    win.className = 'window';
    // Posicionamento centralizado responsivo
    win.style.left = '7.5%';
    win.style.top = '15%';
    win.style.zIndex = currentZ++;
    win.innerHTML = `
      <div class="window-bar">
        <div class="window-title"><img src="${iconUrl}" width="20" height="20"> ${title}</div>
        <div><div class="win-btn min">─</div><div class="win-btn close">✕</div></div>
      </div>
      <div class="window-content">${contentHtml}</div>
    `;
    desktop.appendChild(win);
    
    const bar = win.querySelector('.window-bar');
    const closeBtn = win.querySelector('.close');
    const minBtn = win.querySelector('.min');
    
    closeBtn.onclick = () => win.remove();
    minBtn.onclick = () => win.classList.toggle('hide');
    
    // Arrastar (suporte mobile + desktop)
    let drag = false, startX, startY, left0, top0;
    function onStart(e) {
      if (e.target === closeBtn || e.target === minBtn) return;
      drag = true;
      const cx = e.clientX ?? e.touches[0].clientX;
      const cy = e.clientY ?? e.touches[0].clientY;
      startX = cx; startY = cy;
      left0 = win.offsetLeft; top0 = win.offsetTop;
      e.preventDefault();
    }
    function onMove(e) {
      if (!drag) return;
      const cx = e.clientX ?? e.touches[0].clientX;
      const cy = e.clientY ?? e.touches[0].clientY;
      let nl = left0 + (cx - startX);
      let nt = top0 + (cy - startY);
      // limites para não sair da tela
      nl = Math.min(Math.max(0, nl), window.innerWidth - win.offsetWidth);
      nt = Math.min(Math.max(0, nt), window.innerHeight - win.offsetHeight - 50);
      win.style.left = nl + 'px';
      win.style.top = nt + 'px';
      win.style.width = ''; // remove override inline
    }
    function onEnd() { drag = false; }
    bar.addEventListener('mousedown', onStart);
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onEnd);
    bar.addEventListener('touchstart', onStart);
    document.addEventListener('touchmove', onMove);
    document.addEventListener('touchend', onEnd);
    
    showToast(`📂 ${title} aberto`);
    return win;
  }

  // ========== CONTEÚDO DE CADA APP ==========
  function getContent(app) {
    if (app === 'chrome') return `<iframe src="https://www.google.com/webhp?igu=1" title="Google Chrome"></iframe>`;
    if (app === 'terminal') return `
      <div class="terminal-body" id="termBody">
        <div class="terminal-line">> CyberOS Terminal v2.0</div>
        <div class="terminal-line">> Digite 'help' para comandos</div>
        <div id="termOut" class="terminal-line">$ Bem-vindo ao Fusion OS</div>
        <input type="text" id="termInput" class="terminal-input" placeholder="comando...">
      </div>
    `;
    if (app === 'store') return `
      <div style="text-align:center;">
        <h3 style="color:#0ff; margin-bottom:16px;">🌀 Cyber Store</h3>
        <button class="store-btn" data-name="Hacker Tool Pro">📀 Hacker Tool Pro - Instalar</button>
        <button class="store-btn" data-name="Fusion Wallpapers">🖼️ Fusion Wallpapers - Instalar</button>
        <button class="store-btn" data-name="Neon Game Pack">🎮 Neon Game Pack - Instalar</button>
        <button class="store-btn" data-name="Cyber Security Kit">🛡️ Cyber Security Kit - Instalar</button>
      </div>
    `;
    if (app === 'settings') return `
      <div>
        <h3 style="color:#0ff;">⚙️ Configurações</h3>
        <p id="settingsBatt" style="margin:12px 0;">🔋 Bateria: --%</p>
        <p>🎨 Tema: Cyberpunk Neon</p>
        <p>📱 Modo Responsivo: Ativo</p>
        <p>🐧 Fusão: Windows + Linux + Mac + iOS</p>
        <button id="testNotif" style="background:#0ff; border:none; padding:10px 20px; border-radius:30px; margin-top:16px; font-weight:bold;">🔔 Testar Notificação</button>
      </div>
    `;
    if (app === 'calc') return `
      <div class="calc-display" id="calcDisplay">0</div>
      <div class="calc-buttons">
        <div class="calc-btn" data-val="7">7</div><div class="calc-btn" data-val="8">8</div><div class="calc-btn" data-val="9">9</div><div class="calc-btn" data-op="/">/</div>
        <div class="calc-btn" data-val="4">4</div><div class="calc-btn" data-val="5">5</div><div class="calc-btn" data-val="6">6</div><div class="calc-btn" data-op="*">*</div>
        <div class="calc-btn" data-val="1">1</div><div class="calc-btn" data-val="2">2</div><div class="calc-btn" data-val="3">3</div><div class="calc-btn" data-op="-">-</div>
        <div class="calc-btn" data-val="0">0</div><div class="calc-btn" id="calcC">C</div><div class="calc-btn" id="calcEq">=</div><div class="calc-btn" data-op="+">+</div>
      </div>
    `;
    if (app === 'finder') return `
      <div>
        <h3 style="color:#0ff;">📁 Finder</h3>
        <div style="margin-top:16px; display:flex; flex-wrap:wrap; gap:16px;">
          <div>📄 Documentos</div><div>🖼️ Imagens</div><div>🎵 Músicas</div><div>💾 Apps</div><div>🐧 Linux</div><div>🪟 Windows</div>
        </div>
      </div>
    `;
    return `<div>App ${app}</div>`;
  }

  // ========== ABRIR APP ==========
  function openApp(appName) {
    let title = '', icon = '';
    if (appName === 'chrome') { title = 'Google Chrome'; icon = 'https://cdn-icons-png.flaticon.com/512/6124/6124999.png'; }
    else if (appName === 'terminal') { title = 'Terminal Linux'; icon = 'https://cdn-icons-png.flaticon.com/512/2997/2997922.png'; }
    else if (appName === 'store') { title = 'Cyber Store'; icon = 'https://cdn-icons-png.flaticon.com/512/5968/5968705.png'; }
    else if (appName === 'settings') { title = 'Configurações'; icon = 'https://cdn-icons-png.flaticon.com/512/2997/2997933.png'; }
    else if (appName === 'calc') { title = 'Calculadora'; icon = 'https://cdn-icons-png.flaticon.com/512/3665/3665923.png'; }
    else if (appName === 'finder') { title = 'Finder'; icon = 'https://cdn-icons-png.flaticon.com/512/1828/1828970.png'; }
    else return;
    
    const content = getContent(appName);
    const win = createWindow(title, icon, content);
    
    // Eventos específicos após criar a janela
    setTimeout(() => {
      if (appName === 'terminal') {
        const input = document.getElementById('termInput');
        if (input) {
          input.onkeypress = (e) => {
            if (e.key === 'Enter') {
              const cmd = input.value.trim().toLowerCase();
              const out = document.getElementById('termOut');
              if (cmd === 'help') out.innerText = 'Comandos: help, ls, cyber, windows, linux, mac, ios, fusion';
              else if (cmd === 'ls') out.innerText = 'Desktop/   Downloads/   Documents/   Videos/';
              else if (cmd === 'cyber') out.innerText = '💀 CyberOS Fusion - Modo Hack ativado';
              else if (cmd === 'windows') out.innerText = '🪟 Windows 11 mode: Interface integrada';
              else if (cmd === 'linux') out.innerText = '🐧 Kernel 6.1 + Ubuntu 24.04';
              else if (cmd === 'mac') out.innerText = '🍎 macOS Sonoma - Dock e Blur';
              else if (cmd === 'ios') out.innerText = '📱 iOS 17 - Status bar e gestures';
              else if (cmd === 'fusion') out.innerText = '🌀 Fusion OS: Windows + Linux + Mac + iOS';
              else out.innerText = `Comando desconhecido: ${cmd}`;
              input.value = '';
            }
          };
        }
      }
      if (appName === 'store') {
        document.querySelectorAll('.store-btn').forEach(btn => {
          btn.onclick = () => showToast(`✅ ${btn.getAttribute('data-name')} instalado com sucesso!`);
        });
      }
      if (appName === 'settings') {
        const battSpan = document.getElementById('settingsBatt');
        if (battSpan && window.currentBatteryLevel !== undefined) {
          battSpan.innerText = `🔋 Bateria: ${window.currentBatteryLevel}% ${window.batteryCharging ? '⚡ Carregando' : ''}`;
        }
        document.getElementById('testNotif')?.addEventListener('click', () => showToast('🔔 Notificação: Sistema Fusion funcionando perfeitamente!'));
      }
      if (appName === 'calc') {
        let val = '0', prev = null, op = null;
        const disp = document.getElementById('calcDisplay');
        const update = () => { if(disp) disp.innerText = val; };
        document.querySelectorAll('.calc-btn[data-val]').forEach(btn => {
          btn.onclick = () => { val = (val === '0') ? btn.getAttribute('data-val') : val + btn.getAttribute('data-val'); update(); };
        });
        document.querySelectorAll('.calc-btn[data-op]').forEach(btn => {
          btn.onclick = () => { prev = parseFloat(val); op = btn.getAttribute('data-op'); val = '0'; };
        });
        const clearBtn = document.getElementById('calcC');
        if (clearBtn) clearBtn.onclick = () => { val = '0'; prev = null; op = null; update(); };
        const equalBtn = document.getElementById('calcEq');
        if (equalBtn) equalBtn.onclick = () => {
          if (op && prev !== null) {
            const cur = parseFloat(val);
            let res = 0;
            if (op === '+') res = prev + cur;
            else if (op === '-') res = prev - cur;
            else if (op === '*') res = prev * cur;
            else if (op === '/') res = prev / cur;
            val = res.toString();
            update();
            prev = null; op = null;
          }
        };
      }
    }, 50);
  }

  // ========== RELÓGIO EM TEMPO REAL ==========
  function updateClock() {
    const now = new Date();
    const h = now.getHours().toString().padStart(2,'0');
    const m = now.getMinutes().toString().padStart(2,'0');
    const s = now.getSeconds().toString().padStart(2,'0');
    const clockSpan = document.getElementById('liveClock');
    if (clockSpan) clockSpan.innerText = `${h}:${m}:${s}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  // ========== BATERIA REAL ==========
  window.currentBatteryLevel = 87;
  window.batteryCharging = false;
  if ('getBattery' in navigator) {
    navigator.getBattery().then(battery => {
      function updateBatt() {
        window.currentBatteryLevel = Math.floor(battery.level * 100);
        window.batteryCharging = battery.charging;
        const battSpan = document.getElementById('batteryDisplay');
        if (battSpan) battSpan.innerText = battery.charging ? `⚡ ${window.currentBatteryLevel}%` : `🔋 ${window.currentBatteryLevel}%`;
        const settingsBatt = document.getElementById('settingsBatt');
        if (settingsBatt) settingsBatt.innerText = `🔋 Bateria: ${window.currentBatteryLevel}% ${battery.charging ? '(Carregando)' : ''}`;
      }
      updateBatt();
      battery.addEventListener('levelchange', updateBatt);
      battery.addEventListener('chargingchange', updateBatt);
    }).catch(() => {
      document.getElementById('batteryDisplay').innerText = '🔋 92%';
    });
  } else {
    let fakeBatt = 94;
    setInterval(() => { fakeBatt = Math.max(0, fakeBatt-0.5); document.getElementById('batteryDisplay').innerText = `🔋 ${Math.floor(fakeBatt)}%`; }, 30000);
    document.getElementById('batteryDisplay').innerText = '🔋 94%';
  }

  // ========== EVENTOS GLOBAIS (todos os botões) ==========
  function bindAllButtons() {
    document.querySelectorAll('[data-app]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const app = el.getAttribute('data-app');
        openApp(app);
        document.getElementById('startMenu').classList.add('hide');
      });
    });
  }
  bindAllButtons();

  // Botão Iniciar (primeiro ícone do dock)
  const startDockBtn = document.querySelector('.dock-icon:first-child');
  const startMenuDiv = document.getElementById('startMenu');
  if (startDockBtn) {
    startDockBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      startMenuDiv.classList.toggle('hide');
    });
  }
  document.addEventListener('click', (e) => {
    if (startMenuDiv && !startMenuDiv.contains(e.target) && !startDockBtn.contains(e.target) && !startMenuDiv.classList.contains('hide')) {
      startMenuDiv.classList.add('hide');
    }
  });

  showToast('🚀 CyberOS Fusion responsivo! Toque nos ícones - Janelas se ajustam a qualquer tela');
</script>
</body>
</html>
