<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fusion OS - POWER.bit | Gabriel Moretti</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ESTILOS BASEADOS NA IDENTIDADE POWER.bit
           [span_4](start_span)Cores: Primary (#3483FA), Secondary (#FF6B6B), Accent (#FFD166)[span_4](end_span)
        */
        :root {
            --primary: #3483FA;
            --primary-dark: #2a68c8;
            --secondary: #FF6B6B;
            --accent: #FFD166;
            --dark-os: #0a0f1f;
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --neon-shadow: 0 0 15px rgba(52, 131, 250, 0.5);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #0a0f1f 0%, #010105 100%);
            height: 100vh;
            overflow: hidden;
            color: white;
        }

        /* Desktop / Papel de Parede */
        #desktop {
            width: 100%;
            height: 100%;
            position: relative;
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }

        /* BARRA DE STATUS SUPERIOR (Cyberpunk Style) */
        .status-bar {
            height: 30px;
            width: 100%;
            background: var(--glass);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            font-size: 0.8rem;
            border-bottom: 1px solid var(--glass-border);
            z-index: 1000;
        }

        .status-left { display: flex; gap: 10px; align-items: center; }
        .status-right { display: flex; gap: 15px; align-items: center; font-weight: 500; }
        .brand-os { font-family: 'Press Start 2P', cursive; font-size: 0.5rem; color: var(--primary); }

        /* DOCK INFERIOR */
        .dock-container {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 15px;
            border-radius: 20px;
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            z-index: 900;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .dock-icon {
            width: 45px;
            height: 45px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dock-icon img { width: 100%; height: 100%; object-fit: contain; }
        .dock-icon:hover { transform: translateY(-10px) scale(1.2); filter: drop-shadow(0 0 8px var(--primary)); }
        .dock-icon:active { transform: scale(0.9); }

        /* MENU INICIAR */
        #start-menu {
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%) translateY(120%);
            width: 90%;
            max-width: 400px;
            height: 60vh;
            background: rgba(10, 15, 31, 0.95);
            backdrop-filter: blur(25px);
            border-radius: 20px;
            border: 1px solid var(--primary);
            padding: 20px;
            z-index: 850;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 30px rgba(52, 131, 250, 0.3);
        }

        #start-menu.active { transform: translateX(-50%) translateY(0); }

        .start-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            overflow-y: auto;
            max-height: calc(100% - 40px);
            padding-bottom: 20px;
        }

        .start-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-size: 0.7rem;
            text-align: center;
        }

        .start-item img { width: 40px; height: 40px; margin-bottom: 5px; }

        /* JANELAS FLUTUANTES */
        .window {
            position: absolute;
            width: 90%;
            height: 70%;
            top: 15%;
            left: 5%;
            background: var(--dark-os);
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            display: none;
            flex-direction: column;
            z-index: 100;
            overflow: hidden;
            animation: windowOpen 0.3s ease-out;
        }

        @keyframes windowOpen {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .window-header {
            background: var(--glass);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
        }

        .window-title { font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .window-controls { display: flex; gap: 10px; }
        .win-btn { width: 24px; height: 24px; border-radius: 50%; border: none; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; }
        .win-close { background: #ff5f56; }
        .win-min { background: #ffbd2e; }

        .window-content { flex: 1; overflow: auto; padding: 15px; background: #010105; }

        /* APPS INTERNOS ESPECÍFICOS */
        /* Calculadora */
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; height: 100%; }
        .calc-display { grid-column: span 4; background: #222; padding: 15px; text-align: right; font-size: 1.5rem; border-radius: 8px; margin-bottom: 10px; font-family: monospace; }
        .calc-btn { background: #333; border: none; color: white; padding: 15px; border-radius: 8px; font-size: 1.2rem; }
        .calc-btn.op { background: var(--primary); }

        /* Terminal */
        .terminal-body { font-family: 'Courier New', Courier, monospace; color: #0f0; height: 100%; overflow-y: auto; }
        .term-input-line { display: flex; gap: 10px; margin-top: 10px; }
        .term-input { background: transparent; border: none; color: #0f0; outline: none; flex: 1; font-family: inherit; }

        /* Info Sistema */
        .sys-info-card { background: var(--glass); padding: 15px; border-radius: 10px; border-left: 4px solid var(--primary); margin-bottom: 10px; }

        /* Scrollbar Custom */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

    </style>
</head>
<body>

    <div class="status-bar">
        <div class="status-left">
            <span class="brand-os">FUSION OS</span>
            <span id="os-status-text">POWER.bit Systems</span>
        </div>
        <div class="status-right">
            <span id="battery-status"><i class="fas fa-battery-three-quarters"></i> 75%</span>
            <span id="clock">00:00:00</span>
        </div>
    </div>

    <div id="desktop">
        </div>

    <div id="start-menu">
        <h3 style="margin-bottom: 20px; font-size: 1rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px;">Aplicativos</h3>
        <div class="start-grid" id="start-grid-content">
            </div>
    </div>

    <div class="dock-container">
        <div class="dock-icon" onclick="toggleStart()"><img src="https://cdn-icons-png.flaticon.com/512/732/732221.png" alt="Start" style="filter: hue-rotate(180deg);"></div>
        <div class="dock-icon" onclick="openApp('chrome')"><img src="https://cdn-icons-png.flaticon.com/512/6124/6124999.png" alt="Chrome"></div>
        <div class="dock-icon" onclick="openApp('youtube')"><img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YT"></div>
        <div class="dock-icon" onclick="openApp('whatsapp')"><img src="https://cdn-icons-png.flaticon.com/512/124/124034.png" alt="WA"></div>
        <div class="dock-icon" onclick="openApp('calc')"><img src="https://cdn-icons-png.flaticon.com/512/3665/3665923.png" alt="Calc"></div>
        <div class="dock-icon" onclick="openApp('terminal')"><img src="https://cdn-icons-png.flaticon.com/512/2997/2997922.png" alt="Term"></div>
    </div>

    <script>
        // CONFIGURAÇÃO DOS APPS
        const APPS = [
            { id: 'chrome', name: 'Chrome', icon: 'https://cdn-icons-png.flaticon.com/512/6124/6124999.png', type: 'ext', url: 'https://www.google.com' },
            { id: 'youtube', name: 'YouTube', icon: 'https://cdn-icons-png.flaticon.com/512/1384/1384060.png', type: 'ext', url: 'https://www.youtube.com' },
            { id: 'whatsapp', name: 'WhatsApp', icon: 'https://cdn-icons-png.flaticon.com/512/124/124034.png', type: 'ext', url: 'https://web.whatsapp.com' },
            { id: 'instagram', name: 'Instagram', icon: 'https://cdn-icons-png.flaticon.com/512/2111/2111463.png', type: 'ext', url: 'https://www.instagram.com' },
            { id: 'facebook', name: 'Facebook', icon: 'https://cdn-icons-png.flaticon.com/512/5968/5968764.png', type: 'ext', url: 'https://www.facebook.com' },
            { id: 'calc', name: 'Calculadora', icon: 'https://cdn-icons-png.flaticon.com/512/3665/3665923.png', type: 'int' },
            { id: 'terminal', name: 'Terminal', icon: 'https://cdn-icons-png.flaticon.com/512/2997/2997922.png', type: 'int' },
            { id: 'notes', name: 'Bloco Notas', icon: 'https://cdn-icons-png.flaticon.com/512/2997/2997922.png', type: 'int' },
            { id: 'sysinfo', name: 'Info Sistema', icon: 'https://cdn-icons-png.flaticon.com/512/1828/1828970.png', type: 'int' },
            { id: 'settings', name: 'Configurações', icon: 'https://cdn-icons-png.flaticon.com/512/2997/2997933.png', type: 'int' },
            { id: 'netflix', name: 'Netflix', icon: 'https://cdn-icons-png.flaticon.com/512/870/870910.png', type: 'ext', url: 'https://www.netflix.com' },
            { id: 'spotify', name: 'Spotify', icon: 'https://cdn-icons-png.flaticon.com/512/2111/2111624.png', type: 'ext', url: 'https://www.spotify.com' },
            { id: 'twitter', name: 'Twitter/X', icon: 'https://cdn-icons-png.flaticon.com/512/733/733579.png', type: 'ext', url: 'https://www.x.com' },
            { id: 'tiktok', name: 'TikTok', icon: 'https://cdn-icons-png.flaticon.com/512/3046/3046126.png', type: 'ext', url: 'https://www.tiktok.com' },
            { id: 'drive', name: 'Google Drive', icon: 'https://cdn-icons-png.flaticon.com/512/2991/2991112.png', type: 'ext', url: 'https://drive.google.com' }
        ];

        // INICIALIZAÇÃO
        document.addEventListener('DOMContentLoaded', () => {
            renderStartMenu();
            updateClock();
            updateBattery();
            setInterval(updateClock, 1000);
            
            // Drag and Drop Logic para janelas
            initWindowManager();
        });

        // RENDERIZAÇÃO DO MENU
        function renderStartMenu() {
            const grid = document.getElementById('start-grid-content');
            APPS.forEach(app => {
                const item = document.createElement('div');
                item.className = 'start-item';
                item.onclick = () => { openApp(app.id); toggleStart(); };
                item.innerHTML = `
                    <img src="${app.icon}" alt="${app.name}">
                    <span>${app.name}</span>
                `;
                grid.appendChild(item);
            });
        }

        // LÓGICA DE ABERTURA DE APPS
        function openApp(id) {
            const app = APPS.find(a => a.id === id);
            if (!app) return;

            if (app.type === 'ext') {
                window.open(app.url, '_blank');
            } else {
                createWindow(app);
            }
        }

        function toggleStart() {
            document.getElementById('start-menu').classList.toggle('active');
        }

        // GERENCIADOR DE JANELAS
        function createWindow(app) {
            const existing = document.getElementById(`win-${app.id}`);
            if (existing) {
                existing.style.display = 'flex';
                existing.style.zIndex = getTopZ();
                return;
            }

            const win = document.createElement('div');
            win.id = `win-${app.id}`;
            win.className = 'window';
            win.style.display = 'flex';
            win.style.zIndex = getTopZ();
            
            win.innerHTML = `
                <div class="window-header">
                    <div class="window-title"><img src="${app.icon}" width="16"> ${app.name}</div>
                    <div class="window-controls">
                        <button class="win-btn win-min" onclick="closeWin('${app.id}')"><i class="fas fa-minus"></i></button>
                        <button class="win-btn win-close" onclick="closeWin('${app.id}')"><i class="fas fa-times"></i></button>
                    </div>
                </div>
                <div class="window-content" id="content-${app.id}">
                    ${getAppHTML(app.id)}
                </div>
            `;

            document.getElementById('desktop').appendChild(win);
            initAppLogic(app.id);
        }

        function closeWin(id) {
            const win = document.getElementById(`win-${id}`);
            win.style.display = 'none';
        }

        function getTopZ() {
            const wins = document.querySelectorAll('.window');
            let max = 100;
            wins.forEach(w => {
                const z = parseInt(w.style.zIndex);
                if (z > max) max = z;
            });
            return max + 1;
        }

        // CONTEÚDO DOS APPS INTERNOS
        function getAppHTML(id) {
            switch(id) {
                case 'calc':
                    return `
                        <div class="calc-display" id="calc-res">0</div>
                        <div class="calc-grid">
                            <button class="calc-btn op" onclick="calcAction('C')">C</button>
                            <button class="calc-btn op" onclick="calcAction('/')">/</button>
                            <button class="calc-btn op" onclick="calcAction('*')">×</button>
                            <button class="calc-btn op" onclick="calcAction('DEL')">⌫</button>
                            <button class="calc-btn" onclick="calcAction('7')">7</button>
                            <button class="calc-btn" onclick="calcAction('8')">8</button>
                            <button class="calc-btn" onclick="calcAction('9')">9</button>
                            <button class="calc-btn op" onclick="calcAction('-')">-</button>
                            <button class="calc-btn" onclick="calcAction('4')">4</button>
                            <button class="calc-btn" onclick="calcAction('5')">5</button>
                            <button class="calc-btn" onclick="calcAction('6')">6</button>
                            <button class="calc-btn op" onclick="calcAction('+')">+</button>
                            <button class="calc-btn" onclick="calcAction('1')">1</button>
                            <button class="calc-btn" onclick="calcAction('2')">2</button>
                            <button class="calc-btn" onclick="calcAction('3')">3</button>
                            <button class="calc-btn op" onclick="calcAction('=')">=</button>
                            <button class="calc-btn" style="grid-column: span 2" onclick="calcAction('0')">0</button>
                            <button class="calc-btn" onclick="calcAction('.')">.</button>
                        </div>
                    `;
                case 'terminal':
                    return `
                        <div class="terminal-body" id="term-out">
                            <div>Fusion OS [Versão 1.0.24] - POWER.bit</div>
                            <div>(c) Gabriel Moretti Corporation. Todos os direitos reservados.</div>
                            <br>
                            <div>Digite 'help' para ver os comandos.</div>
                        </div>
                        <div class="term-input-line">
                            <span>C:\\Users\\Guest></span>
                            <input type="text" class="term-input" id="term-in" autofocus>
                        </div>
                    `;
                case 'sysinfo':
                    return `
                        <div class="sys-info-card">
                            <strong>SISTEMA:</strong> Fusion OS (Android Kernel)
                        </div>
                        <div class="sys-info-card">
                            <strong>PROPRIETÁRIO:</strong> Gabriel Moretti - POWER.bit
                        </div>
                        <div class="sys-info-card">
                            <strong>BATERIA:</strong> <span id="sys-bat">Carregando...</span>
                        </div>
                        <div class="sys-info-card">
                            <strong>RESOLUÇÃO:</strong> ${window.innerWidth}x${window.innerHeight}
                        </div>
                        <div class="sys-info-card">
                            <strong>NAVEGADOR:</strong> ${navigator.vendor}
                        </div>
                    `;
                case 'notes':
                    return `
                        <textarea id="note-area" style="width:100%; height:100%; background:transparent; color:white; border:none; outline:none; resize:none; font-family:inherit; font-size:1rem;"></textarea>
                    `;
                case 'settings':
                    return `
                        <div style="display:flex; flex-direction:column; gap:15px;">
                            <div>
                                <label>Brilho da Tela</label>
                                <input type="range" style="width:100%; accent-color: var(--primary);">
                            </div>
                            <div>
                                <label>Volume do Sistema</label>
                                <input type="range" style="width:100%; accent-color: var(--secondary);">
                            </div>
                            <button onclick="navigator.vibrate(200)" style="padding:10px; background:var(--primary); border:none; border-radius:5px; color:white;">Testar Vibração</button>
                        </div>
                    `;
                default: return 'App em desenvolvimento...';
            }
        }

        // LÓGICA DO RELÓGIO E BATERIA
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
        }

        async function updateBattery() {
            try {
                const battery = await navigator.getBattery();
                const update = () => {
                    const level = Math.floor(battery.level * 100);
                    const icon = battery.charging ? 'fa-bolt' : 'fa-battery-three-quarters';
                    const text = `<i class="fas ${icon}"></i> ${level}%`;
                    document.getElementById('battery-status').innerHTML = text;
                    if(document.getElementById('sys-bat')) document.getElementById('sys-bat').innerText = `${level}% (${battery.charging ? 'Carregando' : 'Descarregando'})`;
                };
                battery.addEventListener('levelchange', update);
                battery.addEventListener('chargingchange', update);
                update();
            } catch(e) {
                document.getElementById('battery-status').innerHTML = '<i class="fas fa-battery-full"></i> 100%';
            }
        }

        // LÓGICA DO TERMINAL
        function initAppLogic(id) {
            if (id === 'terminal') {
                const input = document.getElementById('term-in');
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        const cmd = input.value.toLowerCase();
                        handleTerminal(cmd);
                        input.value = '';
                    }
                });
            }
            if (id === 'notes') {
                const area = document.getElementById('note-area');
                area.value = localStorage.getItem('fusion_notes') || '';
                area.oninput = () => localStorage.setItem('fusion_notes', area.value);
            }
        }

        function handleTerminal(cmd) {
            const out = document.getElementById('term-out');
            let res = '';
            if (cmd === 'help') res = 'Comandos: help, clear, status, about, calc, exit';
            else if (cmd === 'about') res = 'POWER.bit - Criada por Gabriel Moretti. Tecnologia e Confiança.';
            else if (cmd === 'status') res = 'Sistema Fusion OS operacional. Kernel OK. Bateria OK.';
            else if (cmd === 'clear') { out.innerHTML = ''; return; }
            else if (cmd === 'calc') { openApp('calc'); res = 'Abrindo calculadora...'; }
            else res = `Comando '${cmd}' não reconhecido.`;

            out.innerHTML += `<div>C:\\Users\\Guest> ${cmd}</div><div>${res}</div><br>`;
            out.scrollTop = out.scrollHeight;
        }

        // LÓGICA DA CALCULADORA
        let calcExpr = '';
        function calcAction(val) {
            const disp = document.getElementById('calc-res');
            if (val === 'C') calcExpr = '';
            else if (val === 'DEL') calcExpr = calcExpr.slice(0, -1);
            else if (val === '=') {
                try { calcExpr = eval(calcExpr).toString(); } catch { calcExpr = 'Erro'; }
            } else {
                if (calcExpr === '0') calcExpr = '';
                calcExpr += val;
            }
            disp.innerText = calcExpr || '0';
        }

        // DRAG AND DROP (MOBILE E DESKTOP)
        function initWindowManager() {
            document.addEventListener('mousedown', startDrag);
            document.addEventListener('touchstart', startDrag, {passive: false});

            let activeWin = null;
            let offset = { x: 0, y: 0 };

            function startDrag(e) {
                const header = e.target.closest('.window-header');
                if (!header) return;
                
                activeWin = header.parentElement;
                activeWin.style.zIndex = getTopZ();
                
                const clientX = e.clientX || e.touches[0].clientX;
                const clientY = e.clientY || e.touches[0].clientY;
                
                const rect = activeWin.getBoundingClientRect();
                offset.x = clientX - rect.left;
                offset.y = clientY - rect.top;

                document.addEventListener('mousemove', drag);
                document.addEventListener('touchmove', drag, {passive: false});
                document.addEventListener('mouseup', stopDrag);
                document.addEventListener('touchend', stopDrag);
            }

            function drag(e) {
                if (!activeWin) return;
                e.preventDefault();
                
                const clientX = e.clientX || e.touches[0].clientX;
                const clientY = e.clientY || e.touches[0].clientY;
                
                activeWin.style.left = (clientX - offset.x) + 'px';
                activeWin.style.top = (clientY - offset.y) + 'px';
                activeWin.style.margin = '0';
            }

            function stopDrag() {
                activeWin = null;
                document.removeEventListener('mousemove', drag);
                document.removeEventListener('touchmove', drag);
            }
        }
    </script>
</body>
</html>
