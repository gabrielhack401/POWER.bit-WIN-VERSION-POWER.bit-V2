<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Windows 11 Simulator | Apps Internos Completos</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #0a0c12;
      font-family: 'Segoe UI', system-ui, -apple-system, 'Roboto', sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      position: fixed;
    }

    .desktop {
      width: 100%;
      height: 100%;
      position: relative;
      background: radial-gradient(ellipse at 30% 20%, #1a1f2e, #0a0c16);
      overflow: hidden;
    }

    .wallpaper {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      opacity: 0.5;
      pointer-events: none;
    }

    /* Desktop Icons */
    .desktop-icons {
      position: absolute;
      top: 20px;
      left: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      z-index: 10;
    }

    .desktop-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 75px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      border-radius: 14px;
      padding: 8px 4px;
      cursor: pointer;
      transition: 0.1s;
      border: 0.5px solid rgba(255, 255, 255, 0.2);
    }

    .desktop-icon:active {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(0.96);
    }

    .desktop-icon img {
      width: 40px;
      height: 40px;
    }

    .desktop-icon span {
      color: white;
      font-size: 10px;
      margin-top: 5px;
      text-shadow: 0 1px 2px black;
    }

    /* Taskbar */
    .taskbar {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      background: rgba(18, 22, 35, 0.92);
      backdrop-filter: blur(28px);
      border-radius: 28px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      z-index: 1000;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .start-btn {
      background: rgba(0, 120, 212, 0.3);
      border-radius: 18px;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .start-btn:active { background: rgba(0, 120, 212, 0.6); transform: scale(0.96); }
    .start-btn svg { width: 18px; fill: white; }
    .start-btn span { color: white; font-size: 13px; }

    .taskbar-middle {
      display: flex;
      gap: 10px;
      background: rgba(0, 0, 0, 0.3);
      padding: 5px 20px;
      border-radius: 35px;
    }

    .taskbar-app {
      width: 42px;
      height: 42px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .taskbar-app:active { background: rgba(255, 255, 255, 0.3); transform: scale(0.94); }
    .taskbar-app img { width: 24px; height: 24px; }

    .time-area {
      background: rgba(0, 0, 0, 0.5);
      padding: 5px 14px;
      border-radius: 25px;
      color: white;
      font-size: 13px;
      font-family: monospace;
    }

    /* Start Menu */
    .start-menu {
      position: absolute;
      bottom: 78px;
      left: 16px;
      width: 440px;
      max-width: calc(100% - 32px);
      background: rgba(20, 24, 36, 0.97);
      backdrop-filter: blur(40px);
      border-radius: 26px;
      padding: 18px 14px;
      z-index: 1100;
      transition: 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .start-menu.hide { transform: scale(0.9); opacity: 0; visibility: hidden; pointer-events: none; }

    .user-area {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 16px;
    }
    .avatar {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #0078d4, #2b5797);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .apps-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }
    .app-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.07);
      border-radius: 16px;
      padding: 10px 4px;
      cursor: pointer;
    }
    .app-item:active { background: rgba(255,255,255,0.2); }
    .app-item img { width: 34px; height: 34px; }
    .app-item span { color: #eef2ff; font-size: 10px; }

    /* Janelas flutuantes (Apps internos) */
    .window {
      position: absolute;
      top: 10%;
      left: 5%;
      width: 90%;
      height: 75%;
      background: #1e1e2e;
      border-radius: 20px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      border: 1px solid #3a3a4a;
      overflow: hidden;
      transition: 0.2s;
    }
    .window.hide { display: none; }

    .window-header {
      background: #2d2d3a;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: move;
    }
    .window-title {
      color: white;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .window-title img { width: 20px; height: 20px; }
    .close-window {
      background: #ff5f5f;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 20px;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .window-content {
      flex: 1;
      background: white;
      overflow: auto;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Store interno */
    .internal-store {
      background: #0f0f1a;
      padding: 16px;
      overflow-y: auto;
      height: 100%;
    }
    .store-header { color: white; margin-bottom: 16px; }
    .store-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
    }
    .store-card {
      background: #252530;
      border-radius: 16px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
    }
    .store-card:active { background: #3a3a4a; }
    .store-card img { width: 60px; height: 60px; border-radius: 16px; }
    .store-card h4 { color: white; font-size: 14px; margin: 8px 0; }
    .install-internal {
      background: #0078d4;
      border: none;
      padding: 6px 12px;
      border-radius: 20px;
      color: white;
      margin-top: 8px;
    }
    .toast {
      position: absolute;
      bottom: 85px;
      left: 16px;
      right: 16px;
      background: #202020e6;
      backdrop-filter: blur(20px);
      padding: 12px 20px;
      border-radius: 40px;
      color: #00ff88;
      text-align: center;
      z-index: 300;
      transition: 0.2s;
      font-size: 13px;
    }
  </style>
</head>
<body>
<div class="desktop">
  <div class="wallpaper" style="background: url('https://images.pexels.com/photos/956999/microsoft-windows-build-msi-956999.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2') center/cover no-repeat;"></div>

  <div class="desktop-icons">
    <div class="desktop-icon" data-app="chrome"><img src="https://cdn-icons-png.flaticon.com/512/6124/6124999.png"><span>Chrome</span></div>
    <div class="desktop-icon" data-app="store"><img src="https://cdn-icons-png.flaticon.com/512/5968/5968705.png"><span>Microsoft Store</span></div>
    <div class="desktop-icon" data-app="edge"><img src="https://cdn-icons-png.flaticon.com/512/732/732221.png"><span>Edge</span></div>
  </div>

  <div class="taskbar">
    <div class="start-btn" id="startBtn"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z" fill="currentColor"/><rect x="8" y="8" width="3" height="3" fill="#fff"/><rect x="13" y="8" width="3" height="3" fill="#fff"/><rect x="8" y="13" width="3" height="3" fill="#fff"/><rect x="13" y="13" width="3" height="3" fill="#fff"/></svg><span>Iniciar</span></div>
    <div class="taskbar-middle">
      <div class="taskbar-app" data-app="chrome"><img src="https://cdn-icons-png.flaticon.com/512/6124/6124999.png"></div>
      <div class="taskbar-app" data-app="store"><img src="https://cdn-icons-png.flaticon.com/512/5968/5968705.png"></div>
      <div class="taskbar-app" data-app="edge"><img src="https://cdn-icons-png.flaticon.com/512/732/732221.png"></div>
    </div>
    <div class="time-area" id="clock">--:--</div>
  </div>

  <div class="start-menu hide" id="startMenu">
    <div class="user-area"><div class="avatar">🪟</div><div style="color:white">Windows 11</div></div>
    <div class="apps-grid">
      <div class="app-item" data-app="chrome"><img src="https://cdn-icons-png.flaticon.com/512/6124/6124999.png"><span>Chrome</span></div>
      <div class="app-item" data-app="store"><img src="https://cdn-icons-png.flaticon.com/512/5968/5968705.png"><span>Microsoft Store</span></div>
      <div class="app-item" data-app="edge"><img src="https://cdn-icons-png.flaticon.com/512/732/732221.png"><span>Edge</span></div>
      <div class="app-item" data-app="calculator"><img src="https://cdn-icons-png.flaticon.com/512/3665/3665923.png"><span>Calculadora</span></div>
    </div>
  </div>

  <!-- Chrome Window (Navegador interno) -->
  <div class="window hide" id="chromeWindow">
    <div class="window-header"><div class="window-title"><img src="https://cdn-icons-png.flaticon.com/512/6124/6124999.png"> Google Chrome</div><button class="close-window" data-window="chrome">✕</button></div>
    <div class="window-content"><iframe src="https://www.google.com/webhp?igu=1" title="Chrome Browser"></iframe></div>
  </div>

  <!-- Edge Window -->
  <div class="window hide" id="edgeWindow">
    <div class="window-header"><div class="window-title"><img src="https://cdn-icons-png.flaticon.com/512/732/732221.png"> Microsoft Edge</div><button class="close-window" data-window="edge">✕</button></div>
    <div class="window-content"><iframe src="https://www.bing.com" title="Edge Browser"></iframe></div>
  </div>

  <!-- Microsoft Store Window (Loja interna com apps) -->
  <div class="window hide" id="storeWindow">
    <div class="window-header"><div class="window-title"><img src="https://cdn-icons-png.flaticon.com/512/5968/5968705.png"> Microsoft Store</div><button class="close-window" data-window="store">✕</button></div>
    <div class="window-content" id="storeContent"></div>
  </div>

  <div class="toast" id="toastMsg" style="opacity:0;">✅</div>
</div>

<script>
  // Lista de apps da loja interna
  const storeApps = [
    { name: "Chrome Browser", icon: "https://cdn-icons-png.flaticon.com/512/6124/6124999.png", desc: "Navegador Google" },
    { name: "Edge Browser", icon: "https://cdn-icons-png.flaticon.com/512/732/732221.png", desc: "Microsoft Edge" },
    { name: "Calculadora", icon: "https://cdn-icons-png.flaticon.com/512/3665/3665923.png", desc: "Calculadora Win11" },
    { name: "Spotify", icon: "https://cdn-icons-png.flaticon.com/512/2111/2111624.png", desc: "Música e podcasts" },
    { name: "YouTube", icon: "https://cdn-icons-png.flaticon.com/512/1384/1384060.png", desc: "Vídeos" },
    { name: "WhatsApp", icon: "https://cdn-icons-png.flaticon.com/512/124/124034.png", desc: "Mensagens" }
  ];

  const toast = document.getElementById('toastMsg');
  function showToast(msg, duration = 2000) {
    toast.style.opacity = '1';
    toast.innerText = msg;
    setTimeout(() => toast.style.opacity = '0', duration);
  }

  // Controle de janelas
  function closeAllWindows() {
    document.querySelectorAll('.window').forEach(w => w.classList.add('hide'));
  }

  function openWindow(windowId) {
    closeAllWindows();
    const win = document.getElementById(windowId);
    if (win) win.classList.remove('hide');
    document.getElementById('startMenu').classList.add('hide');
  }

  // Renderizar Microsoft Store interna
  function renderInternalStore() {
    const container = document.getElementById('storeContent');
    if (!container) return;
    container.innerHTML = `
      <div class="internal-store">
        <div class="store-header"><h2 style="color:cyan;">📦 Microsoft Store</h2><p style="color:#aaa;">Apps disponíveis para instalar</p></div>
        <div class="store-grid" id="storeGridInternal"></div>
      </div>
    `;
    const grid = document.getElementById('storeGridInternal');
    storeApps.forEach(app => {
      const card = document.createElement('div');
      card.className = 'store-card';
      card.innerHTML = `
        <img src="${app.icon}" alt="${app.name}">
        <h4>${app.name}</h4>
        <p style="color:#888; font-size:11px;">${app.desc}</p>
        <button class="install-internal" data-app="${app.name}">Instalar</button>
      `;
      const btn = card.querySelector('.install-internal');
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        showToast(`✅ ${app.name} foi instalado com sucesso!`);
      });
      grid.appendChild(card);
    });
  }

  // Eventos para abrir apps
  function openApp(appType) {
    if (appType === 'chrome') openWindow('chromeWindow');
    else if (appType === 'edge') openWindow('edgeWindow');
    else if (appType === 'store') {
      renderInternalStore();
      openWindow('storeWindow');
    } else if (appType === 'calculator') {
      showToast('🧮 Calculadora: 2 + 2 = 4 (simulação)');
    }
  }

  // Fechar janelas
  document.querySelectorAll('.close-window').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const winId = btn.getAttribute('data-window');
      const win = document.getElementById(`${winId}Window`);
      if (win) win.classList.add('hide');
    });
  });

  // Adicionar eventos a todos os elementos com data-app
  function bindAppEvents() {
    document.querySelectorAll('[data-app]').forEach(el => {
      el.addEventListener('click', (e) => {
        const app = el.getAttribute('data-app');
        openApp(app);
      });
    });
  }

  // Menu Iniciar
  const startBtn = document.getElementById('startBtn');
  const startMenu = document.getElementById('startMenu');
  startBtn.addEventListener('click', () => {
    startMenu.classList.toggle('hide');
  });

  // Fechar menu ao clicar fora
  document.addEventListener('click', (e) => {
    if (!startMenu.contains(e.target) && !startBtn.contains(e.target) && !startMenu.classList.contains('hide')) {
      startMenu.classList.add('hide');
    }
  });

  // Relógio
  function updateClock() {
    const now = new Date();
    const hours = now.getHours().toString().padStart(2, '0');
    const minutes = now.getMinutes().toString().padStart(2, '0');
    document.getElementById('clock').innerText = `${hours}:${minutes}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  bindAppEvents();
  showToast('✅ Windows 11 pronto! Clique no Chrome ou na Microsoft Store - TUDO ABRE DENTRO DA PÁGINA', 3500);
</script>
</body>
  </html>
