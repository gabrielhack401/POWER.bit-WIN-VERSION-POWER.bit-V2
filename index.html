<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Windows 11 | Apps Reais - Chrome + Store</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: #0a0c12;
      font-family: 'Segoe UI', system-ui, -apple-system, 'Roboto', sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      position: fixed;
    }

    .desktop {
      width: 100%;
      height: 100%;
      position: relative;
      background: radial-gradient(ellipse at 30% 20%, #1a1f2e, #0a0c16);
      overflow: hidden;
    }

    .wallpaper {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      opacity: 0.4;
      pointer-events: none;
    }

    .desktop-icons {
      position: absolute;
      top: 20px;
      left: 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      z-index: 10;
    }

    .desktop-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 80px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 10px 4px;
      cursor: pointer;
      transition: 0.1s;
      border: 0.5px solid rgba(255, 255, 255, 0.2);
    }

    .desktop-icon:active {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(0.96);
    }

    .desktop-icon img {
      width: 42px;
      height: 42px;
    }

    .desktop-icon span {
      color: white;
      font-size: 11px;
      margin-top: 6px;
      text-shadow: 0 1px 2px black;
      font-weight: 500;
    }

    .taskbar {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      background: rgba(18, 22, 35, 0.9);
      backdrop-filter: blur(28px);
      border-radius: 28px;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 1000;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .start-btn {
      background: rgba(0, 120, 212, 0.3);
      border-radius: 20px;
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: 0.1s;
    }

    .start-btn:active {
      background: rgba(0, 120, 212, 0.6);
      transform: scale(0.95);
    }

    .start-btn svg {
      width: 20px;
      fill: white;
    }

    .start-btn span {
      color: white;
      font-weight: 500;
      font-size: 14px;
    }

    .taskbar-middle {
      display: flex;
      gap: 12px;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 24px;
      border-radius: 40px;
    }

    .taskbar-app {
      width: 46px;
      height: 46px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.1s;
    }

    .taskbar-app:active {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(0.92);
    }

    .taskbar-app img {
      width: 26px;
      height: 26px;
    }

    .time-area {
      background: rgba(0, 0, 0, 0.5);
      padding: 6px 16px;
      border-radius: 28px;
      color: white;
      font-size: 14px;
      font-weight: 500;
      font-family: monospace;
    }

    .start-menu {
      position: absolute;
      bottom: 82px;
      left: 16px;
      width: 460px;
      max-width: calc(100% - 32px);
      background: rgba(20, 24, 36, 0.96);
      backdrop-filter: blur(40px);
      border-radius: 28px;
      padding: 20px 16px;
      z-index: 1100;
      transition: 0.2s;
      transform-origin: bottom left;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .start-menu.hide {
      transform: scale(0.9);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      margin-bottom: 18px;
    }

    .avatar {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #0078d4, #2b5797);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: white;
    }

    .apps-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }

    .app-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 12px 4px;
      cursor: pointer;
      transition: 0.1s;
    }

    .app-item:active {
      background: rgba(255, 255, 255, 0.2);
    }

    .app-item img {
      width: 38px;
      height: 38px;
    }

    .app-item span {
      color: #eef2ff;
      font-size: 11px;
    }

    .toast {
      position: absolute;
      bottom: 90px;
      left: 16px;
      right: 16px;
      background: #202020e6;
      backdrop-filter: blur(20px);
      padding: 14px 20px;
      border-radius: 48px;
      color: white;
      font-size: 14px;
      z-index: 1300;
      transition: 0.2s;
      text-align: center;
      border-left: 4px solid #0078d4;
      font-weight: 500;
    }
  </style>
</head>
<body>
<div class="desktop">
  <div class="wallpaper" style="background: url('https://images.pexels.com/photos/956999/microsoft-windows-build-msi-956999.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2') center/cover no-repeat;"></div>

  <div class="desktop-icons">
    <div class="desktop-icon" id="chromeDesktopBtn">
      <img src="https://cdn-icons-png.flaticon.com/512/6124/6124999.png" alt="Chrome">
      <span>Google Chrome</span>
    </div>
    <div class="desktop-icon" id="storeDesktopBtn">
      <img src="https://cdn-icons-png.flaticon.com/512/5968/5968705.png" alt="Store">
      <span>Microsoft Store</span>
    </div>
    <div class="desktop-icon" id="edgeDesktopBtn">
      <img src="https://cdn-icons-png.flaticon.com/512/732/732221.png" alt="Edge">
      <span>Microsoft Edge</span>
    </div>
  </div>

  <div class="taskbar">
    <div class="start-btn" id="startBtn">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 4h16v16H4z" fill="currentColor"/><rect x="8" y="8" width="3" height="3" fill="#fff"/><rect x="13" y="8" width="3" height="3" fill="#fff"/><rect x="8" y="13" width="3" height="3" fill="#fff"/><rect x="13" y="13" width="3" height="3" fill="#fff"/></svg>
      <span>Iniciar</span>
    </div>
    <div class="taskbar-middle">
      <div class="taskbar-app" id="chromeTaskBtn">
        <img src="https://cdn-icons-png.flaticon.com/512/6124/6124999.png" alt="Chrome">
      </div>
      <div class="taskbar-app" id="storeTaskBtn">
        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968705.png" alt="Store">
      </div>
      <div class="taskbar-app" id="edgeTaskBtn">
        <img src="https://cdn-icons-png.flaticon.com/512/732/732221.png" alt="Edge">
      </div>
    </div>
    <div class="time-area" id="clock">12:00</div>
  </div>

  <div class="start-menu hide" id="startMenu">
    <div class="user-profile">
      <div class="avatar">👤</div>
      <div style="color: white; font-weight: 500;">Meu Windows 11</div>
    </div>
    <div class="apps-grid">
      <div class="app-item" data-app="chrome">
        <img src="https://cdn-icons-png.flaticon.com/512/6124/6124999.png">
        <span>Chrome</span>
      </div>
      <div class="app-item" data-app="store">
        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968705.png">
        <span>Microsoft Store</span>
      </div>
      <div class="app-item" data-app="edge">
        <img src="https://cdn-icons-png.flaticon.com/512/732/732221.png">
        <span>Edge</span>
      </div>
      <div class="app-item" data-app="maps">
        <img src="https://cdn-icons-png.flaticon.com/512/854/854878.png">
        <span>Mapas</span>
      </div>
    </div>
    <div style="padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 11px; color: #aaa;">⚡ Apps reais - Clique e abra</div>
  </div>

  <div class="toast" id="toastMsg" style="opacity:0;">✅</div>
</div>

<script>
  // Elementos
  const startBtn = document.getElementById('startBtn');
  const startMenu = document.getElementById('startMenu');
  const toast = document.getElementById('toastMsg');

  function showToast(msg, duration = 2000) {
    toast.style.transition = 'opacity 0.15s';
    toast.style.opacity = '1';
    toast.innerText = msg;
    setTimeout(() => {
      toast.style.opacity = '0';
    }, duration);
  }

  // ==================== ABRIR APPS REAIS ====================
  
  // Função para abrir Chrome (ou navegador padrão)
  function openChrome() {
    // Tenta abrir o Google Chrome diretamente
    // No Android, isso abre o Chrome ou o navegador padrão
    window.location.href = 'https://www.google.com/chrome/';
    // Também tenta abrir o app do Chrome via intent (Android)
    setTimeout(() => {
      window.location.href = 'googlechrome://';
    }, 100);
    showToast('🌐 Abrindo Google Chrome...');
  }

  // Função para abrir Microsoft Store OFICIAL
  function openMicrosoftStore() {
    // No Windows: ms-windows-store:
    // No Android: market://details?id=com.microsoft.windowsstore ou link da loja
    // Tenta múltiplos métodos para funcionar em qualquer dispositivo
    const userAgent = navigator.userAgent.toLowerCase();
    const isAndroid = /android/.test(userAgent);
    const isWindows = /win32|win64|windows/.test(userAgent);
    
    if (isAndroid) {
      // Tenta abrir a Microsoft Store no Android (existe o app Microsoft Store)
      window.location.href = 'market://details?id=com.microsoft.windowsstore';
      setTimeout(() => {
        window.location.href = 'https://play.google.com/store/apps/details?id=com.microsoft.windowsstore';
      }, 200);
      showToast('📱 Abrindo Microsoft Store...');
    } else if (isWindows) {
      // URI oficial da Microsoft Store no Windows
      window.location.href = 'ms-windows-store://home';
      showToast('🪟 Abrindo Microsoft Store...');
    } else {
      // Fallback: abre página oficial
      window.open('https://apps.microsoft.com/', '_blank');
      showToast('🌍 Abrindo Microsoft Store online...');
    }
  }

  // Função para abrir Microsoft Edge
  function openEdge() {
    const userAgent = navigator.userAgent.toLowerCase();
    const isAndroid = /android/.test(userAgent);
    
    if (isAndroid) {
      window.location.href = 'microsoft-edge://';
      setTimeout(() => {
        window.location.href = 'https://play.google.com/store/apps/details?id=com.microsoft.emmx';
      }, 200);
      showToast('🌐 Abrindo Microsoft Edge...');
    } else {
      window.open('https://www.microsoft.com/edge', '_blank');
      showToast('🌐 Abrindo Microsoft Edge...');
    }
  }

  // Função para abrir Mapas
  function openMaps() {
    const userAgent = navigator.userAgent.toLowerCase();
    const isAndroid = /android/.test(userAgent);
    
    if (isAndroid) {
      window.location.href = 'geo:0,0?q=mapas';
      showToast('🗺️ Abrindo Google Maps...');
    } else {
      window.open('https://www.bing.com/maps', '_blank');
      showToast('🗺️ Abrindo Mapas...');
    }
  }

  // ==================== EVENTOS DOS BOTÕES ====================
  
  // Botão Iniciar
  startBtn.addEventListener('click', () => {
    if (startMenu.classList.contains('hide')) {
      startMenu.classList.remove('hide');
    } else {
      startMenu.classList.add('hide');
    }
  });

  // Chrome - todos os lugares
  document.getElementById('chromeDesktopBtn').addEventListener('click', openChrome);
  document.getElementById('chromeTaskBtn').addEventListener('click', openChrome);
  
  // Microsoft Store
  document.getElementById('storeDesktopBtn').addEventListener('click', openMicrosoftStore);
  document.getElementById('storeTaskBtn').addEventListener('click', openMicrosoftStore);
  
  // Microsoft Edge
  document.getElementById('edgeDesktopBtn').addEventListener('click', openEdge);
  document.getElementById('edgeTaskBtn').addEventListener('click', openEdge);

  // Apps do menu Start
  document.querySelectorAll('.app-item').forEach(app => {
    app.addEventListener('click', (e) => {
      const appName = app.getAttribute('data-app');
      if (appName === 'chrome') openChrome();
      else if (appName === 'store') openMicrosoftStore();
      else if (appName === 'edge') openEdge();
      else if (appName === 'maps') openMaps();
      startMenu.classList.add('hide');
    });
  });

  // Fechar menu ao clicar fora
  document.addEventListener('click', (e) => {
    if (!startMenu.contains(e.target) && !startBtn.contains(e.target) && !startMenu.classList.contains('hide')) {
      startMenu.classList.add('hide');
    }
  });

  // Relógio em tempo real
  function updateClock() {
    const now = new Date();
    let hours = now.getHours();
    const minutes = now.getMinutes().toString().padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12 || 12;
    document.getElementById('clock').innerText = `${hours}:${minutes} ${ampm}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  // Mensagem de boas-vindas
  setTimeout(() => {
    showToast('✅ Windows 11 pronto! Clique no Chrome ou na Microsoft Store para abrir os apps REAIS', 4000);
  }, 500);
</script>
</body>
</html>
