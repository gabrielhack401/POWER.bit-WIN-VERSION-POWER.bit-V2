<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Fusion OS Pro | Acesso Real ao Sistema</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #000;
      font-family: 'Segoe UI', 'Courier New', monospace;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      position: fixed;
    }
    .desktop {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 30%, #0a0f1f, #010105);
      position: relative;
      overflow: hidden;
    }
    /* Status bar */
    .status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: max(40px, env(safe-area-inset-top, 40px));
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 5%;
      color: #0ff;
      font-family: monospace;
      z-index: 100;
      border-bottom: 1px solid #0ff;
      font-size: clamp(10px, 4vw, 14px);
    }
    /* Dock responsivo */
    .dock {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,255,255,0.12);
      backdrop-filter: blur(20px);
      border-radius: 60px;
      padding: 8px 5%;
      display: flex;
      gap: clamp(8px, 4vw, 20px);
      z-index: 100;
      border: 1px solid #0ff;
      max-width: 95%;
      overflow-x: auto;
    }
    .dock-icon {
      width: clamp(45px, 12vw, 55px);
      height: clamp(45px, 12vw, 55px);
      background: rgba(0,255,255,0.2);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .dock-icon:active { transform: scale(0.92); background: #0ff; }
    .dock-icon img { width: 60%; height: 60%; pointer-events: none; }
    /* Start menu */
    .start-menu {
      position: absolute;
      bottom: 85px;
      left: 5%;
      width: 90%;
      max-width: 320px;
      background: rgba(10,15,25,0.96);
      backdrop-filter: blur(24px);
      border-radius: 24px;
      padding: 16px;
      border: 1px solid #0ff;
      z-index: 200;
    }
    .start-menu.hide { display: none; }
    .menu-header {
      display: flex;
      gap: 12px;
      align-items: center;
      border-bottom: 1px solid #0ff;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .avatar {
      width: clamp(36px, 10vw, 48px);
      height: clamp(36px, 10vw, 48px);
      background: linear-gradient(135deg, #0ff, #0066ff);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(18px, 5vw, 24px);
    }
    .apps-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .menu-app {
      background: rgba(0,255,255,0.1);
      border-radius: 16px;
      padding: 8px 4px;
      text-align: center;
      cursor: pointer;
    }
    .menu-app:active { background: rgba(0,255,255,0.3); }
    .menu-app img { width: clamp(24px, 7vw, 32px); }
    .menu-app span { color: #0ff; font-size: clamp(9px, 3vw, 11px); display: block; }
    /* Janelas responsivas */
    .window {
      position: absolute;
      background: #0e121fe8;
      backdrop-filter: blur(28px);
      border-radius: 20px;
      border: 1.5px solid #0ff;
      box-shadow: 0 0 20px #0ff6;
      display: flex;
      flex-direction: column;
      z-index: 300;
      width: 85% !important;
      max-width: 450px !important;
      min-width: 260px !important;
      height: auto !important;
      max-height: 70vh !important;
      min-height: 300px !important;
      left: 7.5% !important;
      top: 12% !important;
    }
    .window.hide { display: none; }
    .window-bar {
      background: #000000aa;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      cursor: grab;
      border-radius: 20px 20px 0 0;
      border-bottom: 1px solid #0ff;
    }
    .window-title {
      color: #0ff;
      font-weight: bold;
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: clamp(12px, 4vw, 14px);
    }
    .win-btn {
      width: 28px;
      height: 28px;
      border-radius: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin-left: 8px;
    }
    .close { background: #ff3366; color: white; }
    .min { background: #ffaa33; }
    .window-content {
      flex: 1;
      padding: 16px;
      overflow: auto;
      color: white;
    }
    iframe { width: 100%; height: 250px; border: none; border-radius: 12px; background: white; }
    /* Lista de arquivos */
    .file-list {
      background: #0a0e1a;
      border-radius: 16px;
      padding: 12px;
      max-height: 300px;
      overflow-y: auto;
    }
    .file-item {
      padding: 10px;
      border-bottom: 0.5px solid #0ff3;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .file-item:active { background: #0ff2; }
    .setting-item {
      background: #0a0e1a;
      padding: 12px;
      margin: 8px 0;
      border-radius: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .toggle-switch {
      width: 50px;
      height: 26px;
      background: #333;
      border-radius: 30px;
      cursor: pointer;
    }
    .toggle-switch.active { background: #0ff; }
    .toast {
      position: absolute;
      bottom: 90px;
      left: 5%;
      right: 5%;
      width: 90%;
      background: #0ff;
      color: black;
      padding: 12px;
      border-radius: 60px;
      text-align: center;
      font-weight: bold;
      z-index: 500;
      transition: 0.2s;
      font-size: clamp(12px, 4vw, 14px);
    }
  </style>
</head>
<body>
<div class="desktop">
  <div class="status-bar">
    <span>🌀 FUSION OS PRO</span>
    <span id="liveClock">--:--:--</span>
    <span id="batteryDisplay">🔋 --%</span>
  </div>
  <div class="dock">
    <div class="dock-icon" data-app="files"><img src="https://cdn-icons-png.flaticon.com/512/1055/1055687.png"></div>
    <div class="dock-icon" data-app="settings"><img src="https://cdn-icons-png.flaticon.com/512/2997/2997933.png"></div>
    <div class="dock-icon" data-app="info"><img src="https://cdn-icons-png.flaticon.com/512/1828/1828970.png"></div>
    <div class="dock-icon" data-app="test"><img src="https://cdn-icons-png.flaticon.com/512/3665/3665923.png"></div>
    <div class="dock-icon" data-app="chrome"><img src="https://cdn-icons-png.flaticon.com/512/6124/6124999.png"></div>
  </div>
  <div class="start-menu hide" id="startMenu">
    <div class="menu-header"><div class="avatar">🚀</div><div style="color:white;">Fusion OS Pro<br><span style="font-size:10px;">Acesso Real ao Sistema</span></div></div>
    <div class="apps-grid">
      <div class="menu-app" data-app="files"><span>📁 Arquivos</span></div>
      <div class="menu-app" data-app="settings"><span>⚙️ Config</span></div>
      <div class="menu-app" data-app="info"><span>ℹ️ Info</span></div>
      <div class="menu-app" data-app="test"><span>🧪 Teste</span></div>
      <div class="menu-app" data-app="chrome"><span>🌐 Chrome</span></div>
      <div class="menu-app" data-app="permissions"><span>🔐 Permissões</span></div>
    </div>
  </div>
  <div class="toast" id="toastMsg" style="opacity:0;">✅</div>
</div>

<script>
  // ========== TOAST ==========
  const toast = document.getElementById('toastMsg');
  function showToast(msg, duration=2500) {
    toast.innerText = msg;
    toast.style.opacity = '1';
    setTimeout(() => toast.style.opacity = '0', duration);
  }

  // ========== FECHAR JANELAS ==========
  function closeAllWindows() {
    document.querySelectorAll('.window').forEach(w => w.remove());
  }

  // ========== CRIAR JANELA ==========
  let currentZ = 500;
  function createWindow(title, iconUrl, contentHtml) {
    closeAllWindows();
    const desktop = document.querySelector('.desktop');
    const win = document.createElement('div');
    win.className = 'window';
    win.style.left = '7.5%';
    win.style.top = '12%';
    win.style.zIndex = currentZ++;
    win.innerHTML = `
      <div class="window-bar">
        <div class="window-title"><img src="${iconUrl}" width="20"> ${title}</div>
        <div><div class="win-btn min">─</div><div class="win-btn close">✕</div></div>
      </div>
      <div class="window-content">${contentHtml}</div>
    `;
    desktop.appendChild(win);
    
    const closeBtn = win.querySelector('.close');
    const minBtn = win.querySelector('.min');
    closeBtn.onclick = () => win.remove();
    minBtn.onclick = () => win.classList.toggle('hide');
    
    // Arrastar
    const bar = win.querySelector('.window-bar');
    let drag = false, startX, startY, left0, top0;
    function onStart(e) {
      if (e.target === closeBtn || e.target === minBtn) return;
      drag = true;
      const cx = e.clientX ?? e.touches[0].clientX;
      const cy = e.clientY ?? e.touches[0].clientY;
      startX = cx; startY = cy;
      left0 = win.offsetLeft; top0 = win.offsetTop;
      e.preventDefault();
    }
    function onMove(e) {
      if (!drag) return;
      const cx = e.clientX ?? e.touches[0].clientX;
      const cy = e.clientY ?? e.touches[0].clientY;
      let nl = left0 + (cx - startX);
      let nt = top0 + (cy - startY);
      nl = Math.min(Math.max(0, nl), window.innerWidth - win.offsetWidth);
      nt = Math.min(Math.max(0, nt), window.innerHeight - win.offsetHeight - 50);
      win.style.left = nl + 'px';
      win.style.top = nt + 'px';
    }
    function onEnd() { drag = false; }
    bar.addEventListener('mousedown', onStart);
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onEnd);
    bar.addEventListener('touchstart', onStart);
    document.addEventListener('touchmove', onMove);
    document.addEventListener('touchend', onEnd);
    
    return win;
  }

  // ========== PERMISSÕES ==========
  async function requestFilePermission() {
    if ('showDirectoryPicker' in window) {
      try {
        await window.showDirectoryPicker();
        showToast('✅ Permissão de arquivos concedida!');
        return true;
      } catch(e) { showToast('⚠️ Permissão negada'); return false; }
    } else {
      showToast('📱 Use Chrome/Edge para acesso total a arquivos');
      return false;
    }
  }

  // ========== CONTEÚDO DOS APPS ==========
  async function getFilesContent() {
    let fileHtml = '<div class="file-list"><div style="color:#0ff; margin-bottom:12px;">📂 ARMAZENAMENTO</div>';
    
    if ('showDirectoryPicker' in window) {
      fileHtml += `<button id="selectFolderBtn" style="background:#0ff; border:none; padding:12px; border-radius:20px; width:100%; margin-bottom:16px;">📁 SELECIONAR PASTA</button>
                   <div id="folderContent" style="background:#0a0e1a; border-radius:16px; padding:12px; min-height:150px;">
                     <span style="color:#888;">Clique no botão acima para selecionar uma pasta do seu celular</span>
                   </div>`;
    } else {
      fileHtml += `<div style="background:#0a0e1a; padding:16px; border-radius:16px;">
                    <p>⚠️ Seu navegador não suporta acesso direto a arquivos.</p>
                    <p>📱 Recomendação: Use Chrome, Edge ou Opera no Android</p>
                    <hr style="margin:12px 0; border-color:#333;">
                    <p>📂 Diretórios simulados (demo):</p>
                    <div class="file-item">📄 Documentos/</div>
                    <div class="file-item">🖼️ Downloads/</div>
                    <div class="file-item">🎵 Músicas/</div>
                    <div class="file-item">📷 DCIM/</div>
                   </div>`;
    }
    fileHtml += '</div>';
    return fileHtml;
  }

  function getSettingsContent() {
    return `
      <div>
        <h3 style="color:#0ff;">⚙️ CONFIGURAÇÕES REAIS</h3>
        <div class="setting-item"><span>📶 Wi-Fi</span><span id="wifiStatus">Buscando...</span></div>
        <div class="setting-item"><span>🔷 Bluetooth</span><span id="btStatus">Buscando...</span></div>
        <div class="setting-item"><span>🔊 Volume</span><input type="range" id="volumeSlider" min="0" max="100" value="50" style="width:60%;"></div>
        <div class="setting-item"><span>💡 Brilho</span><input type="range" id="brightnessSlider" min="0" max="100" value="80" style="width:60%;"></div>
        <div class="setting-item"><span>🔋 Bateria</span><span id="realBattery">--%</span></div>
        <div class="setting-item"><span>📱 Tela sempre ligada</span><div id="screenToggle" class="toggle-switch"></div></div>
        <button id="testVibration" style="background:#0ff; border:none; padding:12px; border-radius:20px; width:100%; margin-top:16px;">📳 Testar Vibração</button>
        <button id="checkPermissions" style="background:#0ff; border:none; padding:12px; border-radius:20px; width:100%; margin-top:12px;">🔐 Gerenciar Permissões</button>
      </div>
    `;
  }

  function getInfoContent() {
    return `
      <div>
        <h3 style="color:#0ff;">ℹ️ INFORMAÇÕES DO DISPOSITIVO</h3>
        <div class="setting-item"><span>📱 Modelo</span><span id="deviceModel">Carregando...</span></div>
        <div class="setting-item"><span>🤖 Sistema</span><span id="deviceOS">Carregando...</span></div>
        <div class="setting-item"><span>🌐 Navegador</span><span id="browserInfo">Carregando...</span></div>
        <div class="setting-item"><span>📐 Tela</span><span id="screenInfo">Carregando...</span></div>
        <div class="setting-item"><span>⚡ Processador</span><span id="cpuInfo">Carregando...</span></div>
        <div class="setting-item"><span>💾 Memória</span><span id="memoryInfo">Carregando...</span></div>
        <div class="setting-item"><span>🔋 Bateria</span><span id="batteryInfo">Carregando...</span></div>
        <div class="setting-item"><span>📡 Rede</span><span id="networkInfo">Carregando...</span></div>
      </div>
    `;
  }

  function getTestContent() {
    return `
      <div>
        <h3 style="color:#0ff;">🧪 TESTE DE HARDWARE</h3>
        <button id="testDisplay" style="background:#0ff; border:none; padding:12px; border-radius:20px; width:100%; margin:8px 0;">🖥️ Teste de Tela (RGB)</button>
        <button id="testSound" style="background:#0ff; border:none; padding:12px; border-radius:20px; width:100%; margin:8px 0;">🔊 Teste de Áudio</button>
        <button id="testVibration2" style="background:#0ff; border:none; padding:12px; border-radius:20px; width:100%; margin:8px 0;">📳 Teste de Vibração</button>
        <button id="testCamera" style="background:#0ff; border:none; padding:12px; border-radius:20px; width:100%; margin:8px 0;">📷 Teste de Câmera</button>
        <button id="testGPS" style="background:#0ff; border:none; padding:12px; border-radius:20px; width:100%; margin:8px 0;">📍 Teste de GPS</button>
        <div id="testResult" style="margin-top:16px; padding:12px; background:#0a0e1a; border-radius:16px;"></div>
      </div>
    `;
  }

  function getPermissionsContent() {
    return `
      <div>
        <h3 style="color:#0ff;">🔐 PERMISSÕES DO SISTEMA</h3>
        <div class="setting-item"><span>📁 Armazenamento</span><button id="permStorage" class="permBtn" style="background:#0ff; border:none; padding:8px 16px; border-radius:20px;">Solicitar</button></div>
        <div class="setting-item"><span>📍 Localização</span><button id="permLocation" class="permBtn" style="background:#0ff; border:none; padding:8px 16px; border-radius:20px;">Solicitar</button></div>
        <div class="setting-item"><span>📷 Câmera</span><button id="permCamera" class="permBtn" style="background:#0ff; border:none; padding:8px 16px; border-radius:20px;">Solicitar</button></div>
        <div class="setting-item"><span>🎤 Microfone</span><button id="permMicrophone" class="permBtn" style="background:#0ff; border:none; padding:8px 16px; border-radius:20px;">Solicitar</button></div>
        <div class="setting-item"><span>📢 Notificações</span><button id="permNotifications" class="permBtn" style="background:#0ff; border:none; padding:8px 16px; border-radius:20px;">Solicitar</button></div>
      </div>
    `;
  }

  // ========== FUNÇÕES REAIS ==========
  async function updateDeviceInfo() {
    const model = document.getElementById('deviceModel');
    if (model) model.innerText = navigator.userAgent.match(/Android/i) ? 'Android Device' : navigator.platform;
    const os = document.getElementById('deviceOS');
    if (os) os.innerText = navigator.userAgent.includes('Android') ? 'Android ' + (navigator.userAgent.match(/Android\s([0-9.]+)/)?.[1] || '13+') : navigator.userAgent.includes('iOS') ? 'iOS' : 'Desktop';
    const browser = document.getElementById('browserInfo');
    if (browser) browser.innerText = navigator.userAgent.split(' ').slice(-2).join(' ');
    const screen = document.getElementById('screenInfo');
    if (screen) screen.innerText = `${window.screen.width}x${window.screen.height}`;
    const memory = document.getElementById('memoryInfo');
    if (memory && navigator.deviceMemory) memory.innerText = `${navigator.deviceMemory} GB RAM`;
    else if (memory) memory.innerText = 'Não disponível';
    const network = document.getElementById('networkInfo');
    if (network && navigator.connection) network.innerText = `${navigator.connection.effectiveType} - ${navigator.connection.downlink} Mbps`;
    else if (network) network.innerText = 'Não disponível';
  }

  async function updateBatteryReal() {
    if ('getBattery' in navigator) {
      const battery = await navigator.getBattery();
      const level = Math.floor(battery.level * 100);
      const status = battery.charging ? '⚡' : '🔋';
      document.getElementById('batteryDisplay').innerText = `${status} ${level}%`;
      document.getElementById('realBattery') && (document.getElementById('realBattery').innerText = `${level}% ${battery.charging ? '(Carregando)' : ''}`);
      document.getElementById('batteryInfo') && (document.getElementById('batteryInfo').innerText = `${level}% ${battery.charging ? '⚡' : '🔋'}`);
    }
  }

  function updateClock() {
    const now = new Date();
    document.getElementById('liveClock').innerText = now.toLocaleTimeString();
  }

  // ========== ABRIR APP ==========
  async function openApp(appName) {
    let title = '', icon = '', content = '';
    
    if (appName === 'files') {
      title = 'Gerenciador de Arquivos';
      icon = 'https://cdn-icons-png.flaticon.com/512/1055/1055687.png';
      content = await getFilesContent();
      const win = createWindow(title, icon, content);
      setTimeout(() => {
        const btn = document.getElementById('selectFolderBtn');
        if (btn) btn.onclick = async () => {
          if ('showDirectoryPicker' in window) {
            try {
              const dir = await window.showDirectoryPicker();
              let fileList = '<div style="color:#0ff;">📁 ' + dir.name + '</div>';
              for await (const entry of dir.values()) {
                fileList += `<div class="file-item">${entry.kind === 'directory' ? '📁' : '📄'} ${entry.name}</div>`;
              }
              document.getElementById('folderContent').innerHTML = fileList;
              showToast(`✅ Lendo: ${dir.name}`);
            } catch(e) { showToast('Erro ao ler pasta'); }
          }
        };
      }, 50);
      return;
    }
    if (appName === 'settings') {
      title = 'Configurações do Sistema';
      icon = 'https://cdn-icons-png.flaticon.com/512/2997/2997933.png';
      content = getSettingsContent();
      const win = createWindow(title, icon, content);
      setTimeout(() => {
        updateBatteryReal();
        document.getElementById('volumeSlider')?.addEventListener('input', (e) => showToast(`Volume: ${e.target.value}%`));
        document.getElementById('brightnessSlider')?.addEventListener('input', (e) => showToast(`Brilho: ${e.target.value}%`));
        document.getElementById('testVibration')?.addEventListener('click', () => { if('vibrate' in navigator) { navigator.vibrate(200); showToast('📳 Vibração acionada!'); } else showToast('⚠️ Vibração não suportada'); });
        document.getElementById('checkPermissions')?.addEventListener('click', () => openApp('permissions'));
        document.getElementById('wifiStatus').innerText = navigator.connection ? 'Conectado' : 'Verificar';
        document.getElementById('btStatus').innerText = 'Não disponível via Web';
      }, 50);
      return;
    }
    if (appName === 'info') {
      title = 'Informações do Dispositivo';
      icon = 'https://cdn-icons-png.flaticon.com/512/1828/1828970.png';
      content = getInfoContent();
      const win = createWindow(title, icon, content);
      setTimeout(() => { updateDeviceInfo(); updateBatteryReal(); }, 50);
      return;
    }
    if (appName === 'test') {
      title = 'Teste de Hardware';
      icon = 'https://cdn-icons-png.flaticon.com/512/3665/3665923.png';
      content = getTestContent();
      const win = createWindow(title, icon, content);
      setTimeout(() => {
        const result = document.getElementById('testResult');
        document.getElementById('testDisplay')?.addEventListener('click', () => {
          document.body.style.background = 'red';
          setTimeout(() => document.body.style.background = '', 1000);
          result.innerHTML = '🖥️ Tela: OK - Você viu a tela piscar em vermelho?';
        });
        document.getElementById('testSound')?.addEventListener('click', () => {
          const audio = new Audio('data:audio/wav;base64,U3RlYWx0aCBpcyBhIHRlc3Q=');
          audio.play().catch(() => result.innerHTML = '🔊 Teste de áudio: Toque permitido?');
          result.innerHTML = '🔊 Toque de teste reproduzido (se permitido)';
        });
        document.getElementById('testVibration2')?.addEventListener('click', () => {
          if('vibrate' in navigator) { navigator.vibrate([200,100,200]); result.innerHTML = '📳 Vibração acionada!'; }
          else result.innerHTML = '⚠️ Vibração não suportada';
        });
        document.getElementById('testCamera')?.addEventListener('click', async () => {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            stream.getTracks().forEach(t => t.stop());
            result.innerHTML = '📷 Câmera: Permissão concedida!';
          } catch(e) { result.innerHTML = '❌ Câmera: Permissão negada ou não suportada'; }
        });
        document.getElementById('testGPS')?.addEventListener('click', () => {
          if('geolocation' in navigator) {
            navigator.geolocation.getCurrentPosition(pos => {
              result.innerHTML = `📍 GPS: Lat ${pos.coords.latitude.toFixed(4)}, Lon ${pos.coords.longitude.toFixed(4)}`;
            }, err => result.innerHTML = '❌ GPS: Permissão negada');
          } else result.innerHTML = '❌ GPS não suportado';
        });
      }, 50);
      return;
    }
    if (appName === 'chrome') {
      title = 'Google Chrome';
      icon = 'https://cdn-icons-png.flaticon.com/512/6124/6124999.png';
      content = '<iframe src="https://www.google.com/webhp?igu=1"></iframe>';
      createWindow(title, icon, content);
      return;
    }
    if (appName === 'permissions') {
      title = 'Permissões';
      icon = 'https://cdn-icons-png.flaticon.com/512/2997/2997933.png';
      content = getPermissionsContent();
      const win = createWindow(title, icon, content);
      setTimeout(() => {
        document.getElementById('permStorage')?.addEventListener('click', () => requestFilePermission());
        document.getElementById('permLocation')?.addEventListener('click', () => {
          navigator.geolocation.getCurrentPosition(() => showToast('✅ Localização concedida'), () => showToast('❌ Permissão negada'));
        });
        document.getElementById('permCamera')?.addEventListener('click', async () => {
          try { await navigator.mediaDevices.getUserMedia({ video: true }); showToast('✅ Câmera concedida'); }
          catch(e) { showToast('❌ Câmera negada'); }
        });
        document.getElementById('permMicrophone')?.addEventListener('click', async () => {
          try { await navigator.mediaDevices.getUserMedia({ audio: true }); showToast('✅ Microfone concedido'); }
          catch(e) { showToast('❌ Microfone negado'); }
        });
        document.getElementById('permNotifications')?.addEventListener('click', async () => {
          if('Notification' in window) {
            const perm = await Notification.requestPermission();
            showToast(perm === 'granted' ? '✅ Notificações permitidas' : '❌ Notificações negadas');
          }
        });
      }, 50);
      return;
    }
    createWindow(title, icon, content || '<div>App em desenvolvimento</div>');
  }

  // ========== INICIALIZAÇÃO ==========
  setInterval(updateClock, 1000);
  updateClock();
  updateBatteryReal();
  setInterval(updateBatteryReal, 30000);

  function bindEvents() {
    document.querySelectorAll('[data-app]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        openApp(el.getAttribute('data-app'));
        document.getElementById('startMenu').classList.add('hide');
      });
    });
  }
  bindEvents();

  const startDockBtn = document.querySelector('.dock-icon:first-child');
  const startMenu = document.getElementById('startMenu');
  startDockBtn.addEventListener('click', (e) => { e.stopPropagation(); startMenu.classList.toggle('hide'); });
  document.addEventListener('click', (e) => {
    if (!startMenu.contains(e.target) && !startDockBtn.contains(e.target) && !startMenu.classList.contains('hide'))
      startMenu.classList.add('hide');
  });

  showToast('🚀 Fusion OS Pro | Toque para acessar ARQUIVOS REAIS e CONFIGURAÇÕES', 4000);
</script>
</body>
</html>
