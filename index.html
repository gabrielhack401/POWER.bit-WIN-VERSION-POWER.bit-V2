<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Fusion OS Pro | APK + Web | Botões Funcionando</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #000;
      font-family: 'Segoe UI', 'Courier New', monospace;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      position: fixed;
    }
    .desktop {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 30%, #0a0f1f, #010105);
      position: relative;
      overflow: hidden;
    }
    .status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: max(40px, env(safe-area-inset-top, 40px));
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 5%;
      color: #0ff;
      font-family: monospace;
      z-index: 100;
      border-bottom: 1px solid #0ff;
      font-size: clamp(10px, 4vw, 14px);
    }
    .dock {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,255,255,0.12);
      backdrop-filter: blur(20px);
      border-radius: 60px;
      padding: 8px 5%;
      display: flex;
      gap: clamp(8px, 4vw, 20px);
      z-index: 100;
      border: 1px solid #0ff;
      max-width: 95%;
      overflow-x: auto;
    }
    .dock-icon {
      width: clamp(45px, 12vw, 55px);
      height: clamp(45px, 12vw, 55px);
      background: rgba(0,255,255,0.2);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: 0.1s;
    }
    .dock-icon:active { transform: scale(0.92); background: #0ff; }
    .dock-icon img { width: 60%; height: 60%; pointer-events: none; }
    .start-menu {
      position: absolute;
      bottom: 85px;
      left: 5%;
      width: 90%;
      max-width: 320px;
      background: rgba(10,15,25,0.96);
      backdrop-filter: blur(24px);
      border-radius: 24px;
      padding: 16px;
      border: 1px solid #0ff;
      z-index: 200;
    }
    .start-menu.hide { display: none; }
    .menu-header {
      display: flex;
      gap: 12px;
      align-items: center;
      border-bottom: 1px solid #0ff;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .avatar {
      width: clamp(36px, 10vw, 48px);
      height: clamp(36px, 10vw, 48px);
      background: linear-gradient(135deg, #0ff, #0066ff);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(18px, 5vw, 24px);
    }
    .apps-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .menu-app {
      background: rgba(0,255,255,0.1);
      border-radius: 16px;
      padding: 8px 4px;
      text-align: center;
      cursor: pointer;
    }
    .menu-app:active { background: rgba(0,255,255,0.3); }
    .menu-app img { width: clamp(24px, 7vw, 32px); }
    .menu-app span { color: #0ff; font-size: clamp(9px, 3vw, 11px); display: block; }
    .window {
      position: absolute;
      background: #0e121fe8;
      backdrop-filter: blur(28px);
      border-radius: 20px;
      border: 1.5px solid #0ff;
      box-shadow: 0 0 20px #0ff6;
      display: flex;
      flex-direction: column;
      z-index: 300;
      width: 85% !important;
      max-width: 450px !important;
      min-width: 260px !important;
      height: auto !important;
      max-height: 70vh !important;
      min-height: 300px !important;
      left: 7.5% !important;
      top: 12% !important;
    }
    .window.minimized {
      display: none !important;
    }
    .window-bar {
      background: #000000aa;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: grab;
      border-radius: 20px 20px 0 0;
      border-bottom: 1px solid #0ff;
    }
    .window-bar:active { cursor: grabbing; }
    .window-title {
      color: #0ff;
      font-weight: bold;
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: clamp(12px, 4vw, 14px);
    }
    .window-controls {
      display: flex;
      gap: 8px;
    }
    .win-btn {
      width: 32px;
      height: 32px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
      transition: 0.1s;
    }
    .win-btn.close { background: #ff3366; color: white; }
    .win-btn.close:active { background: #ff0000; transform: scale(0.92); }
    .win-btn.min { background: #ffaa33; color: black; }
    .win-btn.min:active { background: #ff8800; transform: scale(0.92); }
    .window-content {
      flex: 1;
      padding: 16px;
      overflow: auto;
      color: white;
    }
    .file-list, .setting-item, .perm-item {
      background: #0a0e1a;
      padding: 12px;
      margin: 8px 0;
      border-radius: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .toggle-switch {
      width: 50px;
      height: 26px;
      background: #333;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.2s;
    }
    .toggle-switch.active { background: #0ff; }
    .toast {
      position: absolute;
      bottom: 90px;
      left: 5%;
      right: 5%;
      width: 90%;
      background: #0ff;
      color: black;
      padding: 12px;
      border-radius: 60px;
      text-align: center;
      font-weight: bold;
      z-index: 500;
      transition: 0.2s;
      font-size: clamp(12px, 4vw, 14px);
    }
    button {
      background: #0ff;
      border: none;
      padding: 10px 16px;
      border-radius: 28px;
      margin: 5px 0;
      font-weight: bold;
      cursor: pointer;
    }
    button:active { transform: scale(0.96); }
    input, select {
      padding: 8px;
      border-radius: 20px;
      border: none;
      background: #1a1e2a;
      color: white;
    }
  </style>
</head>
<body>
<div class="desktop">
  <div class="status-bar">
    <span>🌀 FUSION OS PRO</span>
    <span id="liveClock">--:--:--</span>
    <span id="batteryDisplay">🔋 --%</span>
  </div>
  <div class="dock">
    <div class="dock-icon" data-app="files"><img src="https://cdn-icons-png.flaticon.com/512/1055/1055687.png"></div>
    <div class="dock-icon" data-app="bluetooth"><img src="https://cdn-icons-png.flaticon.com/512/625/625508.png"></div>
    <div class="dock-icon" data-app="settings"><img src="https://cdn-icons-png.flaticon.com/512/2997/2997933.png"></div>
    <div class="dock-icon" data-app="info"><img src="https://cdn-icons-png.flaticon.com/512/1828/1828970.png"></div>
    <div class="dock-icon" data-app="permissions"><img src="https://cdn-icons-png.flaticon.com/512/2997/2997933.png"></div>
    <div class="dock-icon" data-app="sensors"><img src="https://cdn-icons-png.flaticon.com/512/2997/2997922.png"></div>
  </div>
  <div class="start-menu hide" id="startMenu">
    <div class="menu-header"><div class="avatar">🚀</div><div style="color:white;">Fusion OS Pro<br><span style="font-size:10px;">APK + Web</span></div></div>
    <div class="apps-grid">
      <div class="menu-app" data-app="files"><span>📁 Arquivos</span></div>
      <div class="menu-app" data-app="bluetooth"><span>📡 Bluetooth</span></div>
      <div class="menu-app" data-app="settings"><span>⚙️ Config</span></div>
      <div class="menu-app" data-app="info"><span>ℹ️ Info</span></div>
      <div class="menu-app" data-app="permissions"><span>🔐 Permissões</span></div>
      <div class="menu-app" data-app="sensors"><span>📊 Sensores</span></div>
    </div>
  </div>
  <div class="toast" id="toastMsg" style="opacity:0;">✅</div>
</div>

<script>
  // ========== TOAST ==========
  const toast = document.getElementById('toastMsg');
  function showToast(msg, duration=2500) {
    toast.innerText = msg;
    toast.style.opacity = '1';
    setTimeout(() => toast.style.opacity = '0', duration);
  }

  // ========== JANELAS ==========
  let currentWindow = null;
  let currentZ = 500;

  function closeAllWindows() {
    if (currentWindow) {
      currentWindow.remove();
      currentWindow = null;
    }
  }

  function createWindow(title, iconUrl, contentHtml) {
    // Fecha janela anterior se existir
    if (currentWindow) {
      currentWindow.remove();
      currentWindow = null;
    }
    
    const desktop = document.querySelector('.desktop');
    const win = document.createElement('div');
    win.className = 'window';
    win.style.left = '7.5%';
    win.style.top = '12%';
    win.style.zIndex = currentZ++;
    
    win.innerHTML = `
      <div class="window-bar">
        <div class="window-title"><img src="${iconUrl}" width="20" height="20"> ${title}</div>
        <div class="window-controls">
          <div class="win-btn min" data-action="min">─</div>
          <div class="win-btn close" data-action="close">✕</div>
        </div>
      </div>
      <div class="window-content">${contentHtml}</div>
    `;
    
    desktop.appendChild(win);
    currentWindow = win;
    
    // EVENTOS DOS BOTÕES - CORRIGIDOS!
    const closeBtn = win.querySelector('.close');
    const minBtn = win.querySelector('.min');
    
    // Fechar janela
    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      win.remove();
      currentWindow = null;
      showToast(`🔒 Janela fechada`);
    });
    
    // Minimizar janela
    minBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      win.classList.toggle('minimized');
      showToast(win.classList.contains('minimized') ? `📎 Janela minimizada` : `📂 Janela restaurada`);
    });
    
    // Arrastar janela (toque + mouse)
    const bar = win.querySelector('.window-bar');
    let dragging = false;
    let startX, startY, startLeft, startTop;
    
    function onDragStart(e) {
      // Não arrastar se clicou nos botões
      if (e.target.classList && (e.target.classList.contains('win-btn') || e.target.classList.contains('close') || e.target.classList.contains('min'))) {
        return;
      }
      dragging = true;
      const clientX = e.clientX ?? e.touches[0].clientX;
      const clientY = e.clientY ?? e.touches[0].clientY;
      startX = clientX;
      startY = clientY;
      startLeft = win.offsetLeft;
      startTop = win.offsetTop;
      win.style.cursor = 'grabbing';
      e.preventDefault();
    }
    
    function onDragMove(e) {
      if (!dragging) return;
      const clientX = e.clientX ?? e.touches[0].clientX;
      const clientY = e.clientY ?? e.touches[0].clientY;
      let newLeft = startLeft + (clientX - startX);
      let newTop = startTop + (clientY - startY);
      // Limites
      newLeft = Math.max(0, Math.min(newLeft, window.innerWidth - win.offsetWidth));
      newTop = Math.max(0, Math.min(newTop, window.innerHeight - win.offsetHeight - 30));
      win.style.left = newLeft + 'px';
      win.style.top = newTop + 'px';
      win.style.width = ''; // remove override inline
    }
    
    function onDragEnd() {
      dragging = false;
      win.style.cursor = '';
    }
    
    bar.addEventListener('mousedown', onDragStart);
    document.addEventListener('mousemove', onDragMove);
    document.addEventListener('mouseup', onDragEnd);
    bar.addEventListener('touchstart', onDragStart);
    document.addEventListener('touchmove', onDragMove);
    document.addEventListener('touchend', onDragEnd);
    
    return win;
  }

  // ========== CONTEÚDO DOS APPS ==========
  function getFilesContent() {
    return `
      <div>
        <h3 style="color:#0ff;">📁 GERENCIADOR DE ARQUIVOS</h3>
        <button id="pickFileBtn">📄 Selecionar Arquivo</button>
        <button id="pickFolderBtn">📁 Selecionar Pasta</button>
        <div id="fileResult" style="margin-top:12px; background:#0a0e1a; border-radius:16px; padding:12px; max-height:250px; overflow-y:auto;">
          <span style="color:#888;">Clique nos botões para acessar arquivos do celular</span>
        </div>
      </div>
    `;
  }

  function getBluetoothContent() {
    return `
      <div>
        <h3 style="color:#0ff;">📡 BLUETOOTH REAL</h3>
        <div class="setting-item"><span>🔷 Status</span><span id="btRealStatus">Verificando...</span></div>
        <button id="btScanBtn">🔍 Escanear Dispositivos</button>
        <div id="btDevicesList" style="margin-top:12px; background:#0a0e1a; border-radius:16px; padding:12px; max-height:200px; overflow-y:auto;">
          <span style="color:#888;">Clique em escanear</span>
        </div>
        <div style="font-size:11px; color:#888; margin-top:12px;">
          ⚠️ Para Bluetooth real, use o APK com permissões
        </div>
      </div>
    `;
  }

  function getSettingsContent() {
    return `
      <div>
        <h3 style="color:#0ff;">⚙️ CONFIGURAÇÕES</h3>
        <div class="setting-item"><span>🔊 Volume</span><input type="range" id="volumeSlider" min="0" max="100" value="50" style="width:60%;"></div>
        <div class="setting-item"><span>💡 Brilho da Tela</span><input type="range" id="brightSlider" min="0" max="100" value="80" style="width:60%;"></div>
        <div class="setting-item"><span>📳 Vibração</span><button id="vibeTest">Testar Vibração</button></div>
        <div class="setting-item"><span>🔋 Nível da Bateria</span><span id="battLevel">--%</span></div>
        <div class="setting-item"><span>📶 Status da Rede</span><span id="wifiStatus">Verificando...</span></div>
      </div>
    `;
  }

  function getInfoContent() {
    return `
      <div>
        <h3 style="color:#0ff;">ℹ️ INFORMAÇÕES DO DISPOSITIVO</h3>
        <div class="setting-item"><span>📱 Modelo</span><span id="devModel">Carregando...</span></div>
        <div class="setting-item"><span>🤖 Versão Android</span><span id="androidVer">Carregando...</span></div>
        <div class="setting-item"><span>📐 Resolução da Tela</span><span id="screenRes">Carregando...</span></div>
        <div class="setting-item"><span>💾 Memória RAM</span><span id="ramInfo">Carregando...</span></div>
        <div class="setting-item"><span>🔋 Bateria</span><span id="battInfo">Carregando...</span></div>
        <div class="setting-item"><span>🌐 Navegador</span><span id="browserInfo">Carregando...</span></div>
      </div>
    `;
  }

  function getPermissionsContent() {
    return `
      <div>
        <h3 style="color:#0ff;">🔐 PERMISSÕES DO SISTEMA</h3>
        <div class="perm-item"><span>📁 Armazenamento</span><button class="permReq" data-perm="storage">Solicitar</button></div>
        <div class="perm-item"><span>📍 Localização (GPS)</span><button class="permReq" data-perm="location">Solicitar</button></div>
        <div class="perm-item"><span>📷 Câmera</span><button class="permReq" data-perm="camera">Solicitar</button></div>
        <div class="perm-item"><span>🎤 Microfone</span><button class="permReq" data-perm="mic">Solicitar</button></div>
        <div class="perm-item"><span>📡 Bluetooth</span><button class="permReq" data-perm="bluetooth">Solicitar</button></div>
        <div class="perm-item"><span>📢 Notificações</span><button class="permReq" data-perm="notify">Solicitar</button></div>
        <div id="permResult" style="margin-top:16px; background:#0a0e1a; padding:12px; border-radius:16px;"></div>
      </div>
    `;
  }

  function getSensorsContent() {
    return `
      <div>
        <h3 style="color:#0ff;">📊 SENSORES DO CELULAR</h3>
        <div class="setting-item"><span>🔄 Acelerômetro</span><span id="accelData">Aguardando...</span></div>
        <div class="setting-item"><span>🧭 Orientação/Giroscópio</span><span id="orientData">Aguardando...</span></div>
        <div class="setting-item"><span>📍 Localização GPS</span><button id="getGPS">Obter Localização</button></div>
        <div id="gpsResult" style="margin-top:12px; background:#0a0e1a; padding:12px; border-radius:16px;"></div>
      </div>
    `;
  }

  // ========== FUNÇÕES REAIS ==========
  async function updateBattery() {
    if ('getBattery' in navigator) {
      const b = await navigator.getBattery();
      const level = Math.floor(b.level * 100);
      const icon = b.charging ? '⚡' : '🔋';
      document.getElementById('batteryDisplay').innerHTML = `${icon} ${level}%`;
      if (document.getElementById('battLevel')) document.getElementById('battLevel').innerHTML = `${level}% ${b.charging ? '(Carregando)' : ''}`;
      if (document.getElementById('battInfo')) document.getElementById('battInfo').innerHTML = `${level}% ${b.charging ? '⚡' : '🔋'}`;
    }
  }

  function updateClock() {
    const now = new Date();
    const h = now.getHours().toString().padStart(2,'0');
    const m = now.getMinutes().toString().padStart(2,'0');
    const s = now.getSeconds().toString().padStart(2,'0');
    document.getElementById('liveClock').innerHTML = `${h}:${m}:${s}`;
  }
  
  setInterval(updateClock, 1000);
  updateClock();
  updateBattery();
  setInterval(updateBattery, 30000);

  // ========== ABRIR APPS ==========
  async function openApp(app) {
    let title = '', icon = '', content = '';
    
    if (app === 'files') {
      title = 'Gerenciador de Arquivos';
      icon = 'https://cdn-icons-png.flaticon.com/512/1055/1055687.png';
      content = getFilesContent();
      const win = createWindow(title, icon, content);
      setTimeout(() => {
        document.getElementById('pickFileBtn')?.addEventListener('click', () => {
          const input = document.createElement('input');
          input.type = 'file';
          input.onchange = (e) => {
            const file = e.target.files[0];
            document.getElementById('fileResult').innerHTML = `<div>📄 Arquivo selecionado: ${file?.name || 'nenhum'}<br>Tamanho: ${(file?.size / 1024).toFixed(2)} KB</div>`;
            showToast(`✅ Arquivo: ${file?.name}`);
          };
          input.click();
        });
        document.getElementById('pickFolderBtn')?.addEventListener('click', async () => {
          if ('showDirectoryPicker' in window) {
            try {
              const dir = await window.showDirectoryPicker();
              let html = `<div style="color:#0ff;">📁 PASTA: ${dir.name}</div>`;
              for await (const entry of dir.values()) {
                html += `<div class="file-item">${entry.kind === 'directory' ? '📁' : '📄'} ${entry.name}</div>`;
              }
              document.getElementById('fileResult').innerHTML = html;
              showToast(`✅ Lendo pasta: ${dir.name}`);
            } catch(e) { showToast('❌ Selecione uma pasta'); }
          } else {
            showToast('⚠️ Use Chrome para acessar pastas');
            document.getElementById('fileResult').innerHTML = '⚠️ Seu navegador não suporta seleção de pastas. Use Chrome ou o APK para acesso total.';
          }
        });
      }, 50);
      return;
    }
    
    if (app === 'bluetooth') {
      title = 'Bluetooth Real';
      icon = 'https://cdn-icons-png.flaticon.com/512/625/625508.png';
      content = getBluetoothContent();
      const win = createWindow(title, icon, content);
      setTimeout(() => {
        const statusSpan = document.getElementById('btRealStatus');
        statusSpan.innerText = 'Bluetooth API ' + ('bluetooth' in navigator ? 'disponível' : 'não suportada no navegador');
        document.getElementById('btScanBtn')?.addEventListener('click', async () => {
          if ('bluetooth' in navigator) {
            try {
              statusSpan.innerText = 'Escaneando...';
              const device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true });
              statusSpan.innerText = `✅ Conectado: ${device.name || 'desconhecido'}`;
              document.getElementById('btDevicesList').innerHTML = `<div>📡 Dispositivo: ${device.name}<br>ID: ${device.id}</div>`;
              showToast(`✅ Bluetooth: ${device.name || 'Dispositivo encontrado'}`);
            } catch(e) {
              statusSpan.innerText = 'Escaneamento cancelado';
              showToast('❌ Scan cancelado');
            }
          } else {
            statusSpan.innerText = 'Web Bluetooth não suportado. No APK funciona!';
            document.getElementById('btDevicesList').innerHTML = '⚠️ Para Bluetooth real, converta para APK com as permissões adequadas.';
          }
        });
      }, 50);
      return;
    }
    
    if (app === 'settings') {
      title = 'Configurações';
      icon = 'https://cdn-icons-png.flaticon.com/512/2997/2997933.png';
      content = getSettingsContent();
      const win = createWindow(title, icon, content);
      setTimeout(() => {
        document.getElementById('volumeSlider')?.addEventListener('input', (e) => showToast(`🔊 Volume: ${e.target.value}%`));
        document.getElementById('brightSlider')?.addEventListener('input', (e) => showToast(`💡 Brilho: ${e.target.value}%`));
        document.getElementById('vibeTest')?.addEventListener('click', () => {
          if ('vibrate' in navigator) { navigator.vibrate(200); showToast('📳 Vibração acionada!'); }
          else showToast('⚠️ Vibração não suportada');
        });
        document.getElementById('wifiStatus').innerHTML = navigator.connection ? `${navigator.connection.effectiveType} - ${navigator.connection.downlink} Mbps` : 'Desconhecido';
        updateBattery();
      }, 50);
      return;
    }
    
    if (app === 'info') {
      title = 'Informações';
      icon = 'https://cdn-icons-png.flaticon.com/512/1828/1828970.png';
      content = getInfoContent();
      const win = createWindow(title, icon, content);
      setTimeout(() => {
        document.getElementById('devModel').innerHTML = navigator.userAgent.includes('Android') ? 'Dispositivo Android' : navigator.platform;
        document.getElementById('androidVer').innerHTML = navigator.userAgent.match(/Android\s([0-9.]+)/)?.[1] || 'Desconhecido';
        document.getElementById('screenRes').innerHTML = `${window.screen.width} x ${window.screen.height}`;
        document.getElementById('ramInfo').innerHTML = navigator.deviceMemory ? `${navigator.deviceMemory} GB RAM` : 'Não disponível';
        document.getElementById('browserInfo').innerHTML = navigator.userAgent.split(' ').slice(-2).join(' ').substring(0, 50);
        updateBattery();
      }, 50);
      return;
    }
    
    if (app === 'permissions') {
      title = 'Permissões';
      icon = 'https://cdn-icons-png.flaticon.com/512/2997/2997933.png';
      content = getPermissionsContent();
      const win = createWindow(title, icon, content);
      setTimeout(() => {
        const resultDiv = document.getElementById('permResult');
        document.querySelectorAll('.permReq').forEach(btn => {
          btn.addEventListener('click', async () => {
            const perm = btn.getAttribute('data-perm');
            resultDiv.innerHTML = 'Solicitando permissão...';
            if (perm === 'storage') {
              if ('showDirectoryPicker' in window) {
                await window.showDirectoryPicker();
                resultDiv.innerHTML = '✅ Permissão de armazenamento concedida';
              } else resultDiv.innerHTML = '⚠️ Use Chrome ou APK';
            }
            if (perm === 'location') {
              navigator.geolocation.getCurrentPosition(
                () => resultDiv.innerHTML = '✅ Localização concedida',
                () => resultDiv.innerHTML = '❌ Localização negada'
              );
            }
            if (perm === 'camera') {
              try {
                await navigator.mediaDevices.getUserMedia({ video: true });
                resultDiv.innerHTML = '✅ Câmera concedida';
              } catch(e) { resultDiv.innerHTML = '❌ Câmera negada'; }
            }
            if (perm === 'mic') {
              try {
                await navigator.mediaDevices.getUserMedia({ audio: true });
                resultDiv.innerHTML = '✅ Microfone concedido';
              } catch(e) { resultDiv.innerHTML = '❌ Microfone negado'; }
            }
            if (perm === 'bluetooth') {
              if ('bluetooth' in navigator) {
                await navigator.bluetooth.requestDevice({ acceptAllDevices: true });
                resultDiv.innerHTML = '✅ Bluetooth permitido';
              } else resultDiv.innerHTML = '⚠️ Bluetooth via APK funciona melhor';
            }
            if (perm === 'notify') {
              const res = await Notification.requestPermission();
              resultDiv.innerHTML = res === 'granted' ? '✅ Notificações permitidas' : '❌ Notificações negadas';
            }
          });
        });
      }, 50);
      return;
    }
    
    if (app === 'sensors') {
      title = 'Sensores';
      icon = 'https://cdn-icons-png.flaticon.com/512/2997/2997922.png';
      content = getSensorsContent();
      const win = createWindow(title, icon, content);
      setTimeout(() => {
        if (window.DeviceOrientationEvent) {
          window.addEventListener('deviceorientation', (e) => {
            const orientSpan = document.getElementById('orientData');
            if (orientSpan) orientSpan.innerHTML = `α:${Math.round(e.alpha)}° β:${Math.round(e.beta)}° γ:${Math.round(e.gamma)}°`;
          });
        }
        if (window.DeviceMotionEvent) {
          window.addEventListener('devicemotion', (e) => {
            const acc = e.acceleration;
            const accelSpan = document.getElementById('accelData');
            if (accelSpan) accelSpan.innerHTML = `X:${Math.round(acc?.x || 0)} Y:${Math.round(acc?.y || 0)} Z:${Math.round(acc?.z || 0)}`;
          });
        }
        document.getElementById('getGPS')?.addEventListener('click', () => {
          navigator.geolocation.getCurrentPosition(
            (pos) => document.getElementById('gpsResult').innerHTML = `📍 Lat: ${pos.coords.latitude.toFixed(4)}, Lon: ${pos.coords.longitude.toFixed(4)}<br>🎯 Precisão: ±${pos.coords.accuracy}m`,
            () => document.getElementById('gpsResult').innerHTML = '❌ Permissão de localização negada'
          );
        });
      }, 50);
      return;
    }
    
    createWindow(title, icon, content || '<div>App em desenvolvimento</div>');
  }

  // ========== EVENTOS DOS BOTÕES ==========
  function bindEvents() {
    document.querySelectorAll('[data-app]').forEach(el => {
      el.removeEventListener('click', el._handler);
      const handler = (e) => {
        e.stopPropagation();
        const app = el.getAttribute('data-app');
        openApp(app);
        document.getElementById('startMenu').classList.add('hide');
      };
      el.addEventListener('click', handler);
      el._handler = handler;
    });
  }
  
  bindEvents();
  
  // Botão Iniciar
  const startBtn = document.querySelector('.dock-icon:first-child');
  const startMenu = document.getElementById('startMenu');
  if (startBtn) {
    startBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      startMenu.classList.toggle('hide');
    });
  }
  
  // Fechar menu ao clicar fora
  document.addEventListener('click', (e) => {
    if (startMenu && !startMenu.contains(e.target) && !startBtn?.contains(e.target) && !startMenu.classList.contains('hide')) {
      startMenu.classList.add('hide');
    }
  });
  
  showToast('🚀 Fusion OS Pro | Botões ✕ e ─ funcionam! | Arraste as janelas', 4000);
</script>
</body>
</html>
