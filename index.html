<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CyberOS | Fusion Punk - Windows/Linux/Mac/iOS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #000;
      font-family: 'Share Tech Mono', 'Segoe UI', 'Courier New', monospace;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      position: fixed;
    }

    /* Desktop cyberpunk */
    .desktop {
      width: 100%;
      height: 100%;
      position: relative;
      background: radial-gradient(ellipse at 30% 20%, #0a0f1f, #020308);
      overflow: hidden;
    }

    /* Wallpaper com efeito grid */
    .wallpaper {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      opacity: 0.3;
      pointer-events: none;
      filter: hue-rotate(10deg) contrast(1.2);
    }

    /* Barra de status neon */
    .status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 44px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(16px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      z-index: 100;
      color: #0ff;
      font-family: monospace;
      font-size: 13px;
      border-bottom: 1px solid #0ff4;
      text-shadow: 0 0 3px #0ff;
    }
    .battery-status {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Dock cyberpunk */
    .dock {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 255, 255, 0.12);
      backdrop-filter: blur(28px);
      border-radius: 48px;
      padding: 8px 24px;
      display: flex;
      gap: 18px;
      z-index: 100;
      border: 1px solid #0ff;
      box-shadow: 0 0 20px #0ff3;
    }

    .dock-icon {
      width: 58px;
      height: 58px;
      background: rgba(0, 255, 255, 0.1);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.1s;
      border: 0.5px solid #0ff6;
    }
    .dock-icon:active { transform: scale(0.92); background: #0ff4; box-shadow: 0 0 12px #0ff; }
    .dock-icon img { width: 36px; height: 36px; filter: drop-shadow(0 0 2px cyan); pointer-events: none; }

    /* Menu Iniciar */
    .start-menu {
      position: absolute;
      bottom: 90px;
      left: 20px;
      width: 340px;
      background: rgba(8, 12, 20, 0.96);
      backdrop-filter: blur(32px);
      border-radius: 28px;
      padding: 16px;
      z-index: 200;
      border: 1px solid #0ff;
      box-shadow: 0 0 28px #0ff3;
    }
    .start-menu.hide { display: none; }

    .menu-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #0ff;
      margin-bottom: 14px;
    }
    .avatar {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #0ff, #00a);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 0 8px cyan;
    }
    .apps-cyber {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .cyber-app {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      background: rgba(0, 255, 255, 0.08);
      border-radius: 16px;
      padding: 10px 4px;
      cursor: pointer;
      border: 0.5px solid #0ff4;
    }
    .cyber-app:active { background: #0ff3; transform: scale(0.96); }
    .cyber-app img { width: 34px; height: 34px; filter: drop-shadow(0 0 2px cyan); }
    .cyber-app span { color: #0ff; font-size: 11px; font-weight: bold; text-shadow: 0 0 2px black; }

    /* JANELAS FLUTUANTES CYBER */
    .window {
      position: absolute;
      min-width: 300px;
      min-height: 280px;
      background: rgba(10, 15, 25, 0.96);
      backdrop-filter: blur(32px);
      border-radius: 24px;
      border: 1.5px solid #0ff;
      box-shadow: 0 0 24px #0ff6;
      z-index: 300;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .window.hide { display: none; }

    .window-bar {
      background: rgba(0, 30, 40, 0.9);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: grab;
      border-bottom: 1px solid #0ff;
    }
    .window-bar:active { cursor: grabbing; }
    .window-title {
      color: #0ff;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      text-shadow: 0 0 3px cyan;
    }
    .window-controls {
      display: flex;
      gap: 12px;
    }
    .win-btn {
      width: 28px;
      height: 28px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      background: rgba(255,255,255,0.2);
    }
    .win-btn.close { background: #ff3366; box-shadow: 0 0 5px red; }
    .win-btn.min { background: #ffaa33; }
    .window-content {
      flex: 1;
      padding: 16px;
      overflow: auto;
      color: #ccf;
    }
    iframe { width: 100%; height: 100%; border: none; border-radius: 16px; background: #fff; }

    /* Terminal */
    .terminal-body {
      background: #03060c;
      font-family: monospace;
      padding: 12px;
      border-radius: 16px;
      height: 100%;
      overflow-y: auto;
      border: 0.5px solid #0ff;
    }
    .terminal-line { color: #0f0; margin: 4px 0; font-size: 12px; text-shadow: 0 0 2px #0f0; }
    .terminal-input-line {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .terminal-input {
      background: #111;
      border: 1px solid #0ff;
      color: #0f0;
      font-family: monospace;
      flex: 1;
      padding: 6px;
      border-radius: 8px;
    }

    /* Calculadora */
    .calc-display {
      font-size: 42px;
      background: #000c;
      padding: 12px;
      border-radius: 16px;
      text-align: right;
      margin-bottom: 16px;
      border: 1px solid cyan;
    }
    .calc-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .calc-btn {
      background: cyan;
      color: black;
      padding: 12px;
      border-radius: 40px;
      text-align: center;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 4px cyan;
    }
    .calc-btn:active { background: white; transform: scale(0.94); }

    /* Toast */
    .toast {
      position: absolute;
      bottom: 100px;
      left: 20px;
      right: 20px;
      background: #0ffc;
      backdrop-filter: blur(20px);
      padding: 12px;
      border-radius: 40px;
      text-align: center;
      color: black;
      font-weight: bold;
      z-index: 500;
      transition: 0.2s;
    }
  </style>
</head>
<body>
<div class="desktop">
  <div class="wallpaper" style="background: url('https://images.pexels.com/photos/956999/microsoft-windows-build-msi-956999.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2') center/cover no-repeat;"></div>

  <!-- Status Bar com bateria REAL -->
  <div class="status-bar">
    <span>⚡ CYBERPUNK OS</span>
    <div class="time-status" id="cyberClock">--:--:--</div>
    <div class="battery-status" id="batteryArea">🔋 --%</div>
  </div>

  <!-- DOCK -->
  <div class="dock">
    <div class="dock-icon" data-app="finder"><img src="https://cdn-icons-png.flaticon.com/512/1828/1828970.png"></div>
    <div class="dock-icon" data-app="chrome"><img src="https://cdn-icons-png.flaticon.com/512/6124/6124999.png"></div>
    <div class="dock-icon" data-app="terminal"><img src="https://cdn-icons-png.flaticon.com/512/2997/2997922.png"></div>
    <div class="dock-icon" data-app="store"><img src="https://cdn-icons-png.flaticon.com/512/5968/5968705.png"></div>
    <div class="dock-icon" data-app="settings"><img src="https://cdn-icons-png.flaticon.com/512/2997/2997933.png"></div>
    <div class="dock-icon" data-app="calc"><img src="https://cdn-icons-png.flaticon.com/512/3665/3665923.png"></div>
  </div>

  <!-- MENU INICIAR -->
  <div class="start-menu hide" id="startMenu">
    <div class="menu-header">
      <div class="avatar">🤘</div>
      <div><strong style="color:cyan;">CYBER USER</strong><br><span style="font-size:10px;">FUSION EDITION</span></div>
    </div>
    <div class="apps-cyber">
      <div class="cyber-app" data-app="chrome"><img src="https://cdn-icons-png.flaticon.com/512/6124/6124999.png"><span>Chrome</span></div>
      <div class="cyber-app" data-app="terminal"><img src="https://cdn-icons-png.flaticon.com/512/2997/2997922.png"><span>Terminal</span></div>
      <div class="cyber-app" data-app="store"><img src="https://cdn-icons-png.flaticon.com/512/5968/5968705.png"><span>Store</span></div>
      <div class="cyber-app" data-app="settings"><img src="https://cdn-icons-png.flaticon.com/512/2997/2997933.png"><span>Settings</span></div>
      <div class="cyber-app" data-app="calc"><img src="https://cdn-icons-png.flaticon.com/512/3665/3665923.png"><span>Calc</span></div>
      <div class="cyber-app" data-app="finder"><img src="https://cdn-icons-png.flaticon.com/512/1828/1828970.png"><span>Finder</span></div>
    </div>
  </div>

  <div class="toast" id="cyberToast" style="opacity:0;">✅</div>
</div>

<script>
  // ==================== UTILITÁRIOS ====================
  const toast = document.getElementById('cyberToast');
  function showToast(msg, duration=2000) {
    toast.style.opacity = '1';
    toast.innerText = msg;
    setTimeout(() => toast.style.opacity = '0', duration);
  }

  // Fechar todas as janelas
  function closeAllWindows() {
    document.querySelectorAll('.window').forEach(w => w.remove());
  }

  // Criar janela flutuante (apenas uma por vez)
  function createWindow(title, iconUrl, contentHtml, width=380, height=450) {
    closeAllWindows();
    const desktop = document.querySelector('.desktop');
    const winDiv = document.createElement('div');
    winDiv.className = 'window';
    winDiv.style.width = width + 'px';
    winDiv.style.height = height + 'px';
    winDiv.style.left = Math.max(20, (window.innerWidth/2 - width/2)) + 'px';
    winDiv.style.top = Math.max(40, (window.innerHeight/2 - height/2)) + 'px';
    winDiv.style.zIndex = 500;
    
    winDiv.innerHTML = `
      <div class="window-bar">
        <div class="window-title"><img src="${iconUrl}" width="22"> ${title}</div>
        <div class="window-controls">
          <div class="win-btn min">─</div>
          <div class="win-btn close">✕</div>
        </div>
      </div>
      <div class="window-content">${contentHtml}</div>
    `;
    
    desktop.appendChild(winDiv);
    
    // Eventos da janela
    const bar = winDiv.querySelector('.window-bar');
    const closeBtn = winDiv.querySelector('.close');
    const minBtn = winDiv.querySelector('.min');
    
    closeBtn.addEventListener('click', () => winDiv.remove());
    minBtn.addEventListener('click', () => winDiv.classList.toggle('hide'));
    
    // Arrastar (mouse + toque)
    let drag = false, startX, startY, startLeft, startTop;
    function onStart(e) {
      if (e.target === closeBtn || e.target === minBtn) return;
      drag = true;
      const cx = e.clientX ?? e.touches[0].clientX;
      const cy = e.clientY ?? e.touches[0].clientY;
      startX = cx;
      startY = cy;
      startLeft = winDiv.offsetLeft;
      startTop = winDiv.offsetTop;
      winDiv.style.cursor = 'grabbing';
      e.preventDefault();
    }
    function onMove(e) {
      if (!drag) return;
      const cx = e.clientX ?? e.touches[0].clientX;
      const cy = e.clientY ?? e.touches[0].clientY;
      let newLeft = startLeft + (cx - startX);
      let newTop = startTop + (cy - startY);
      newLeft = Math.max(0, Math.min(newLeft, window.innerWidth - winDiv.offsetWidth));
      newTop = Math.max(0, Math.min(newTop, window.innerHeight - winDiv.offsetHeight - 50));
      winDiv.style.left = newLeft + 'px';
      winDiv.style.top = newTop + 'px';
    }
    function onEnd() { drag = false; winDiv.style.cursor = ''; }
    bar.addEventListener('mousedown', onStart);
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onEnd);
    bar.addEventListener('touchstart', onStart);
    document.addEventListener('touchmove', onMove);
    document.addEventListener('touchend', onEnd);
    
    showToast(`🔓 ${title} aberto`, 800);
    return winDiv;
  }

  // ==================== CONTEÚDO DOS APPS ====================
  function getAppContent(appType) {
    if (appType === 'chrome') {
      return `<iframe src="https://www.google.com/webhp?igu=1" title="Chrome"></iframe>`;
    }
    if (appType === 'terminal') {
      return `
        <div class="terminal-body" id="termBody">
          <div class="terminal-line">> CyberOS Terminal v2.0 [Fusion Kernel]</div>
          <div class="terminal-line">> Windows 11 + Linux 6.1 + macOS + iOS</div>
          <div class="terminal-line">> Digite 'help' para comandos</div>
          <div class="terminal-line" id="terminalOutput">user@cyber:~$ Bem-vindo</div>
          <div class="terminal-input-line">
            <span style="color:#0f0;">➜</span>
            <input type="text" id="termInput" class="terminal-input" placeholder="comando...">
          </div>
        </div>
      `;
    }
    if (appType === 'store') {
      return `
        <div style="text-align:center;">
          <h2 style="color:cyan;">🌀 CYBER STORE</h2>
          <div style="display:flex; flex-direction:column; gap:12px; margin-top:16px;">
            <div style="background:#000c; padding:12px; border-radius:20px; border:0.5px solid cyan;">💾 NEO-TOOLKIT <button class="installBtn" data-app="Neo Toolkit" style="float:right; background:cyan; border:none; padding:4px 12px; border-radius:20px;">Instalar</button></div>
            <div style="background:#000c; padding:12px; border-radius:20px; border:0.5px solid cyan;">🔥 HACKER SUITE <button class="installBtn" data-app="Hacker Suite" style="float:right; background:cyan; border:none; padding:4px 12px; border-radius:20px;">Instalar</button></div>
            <div style="background:#000c; padding:12px; border-radius:20px; border:0.5px solid cyan;">🎮 CYBER GAME PACK <button class="installBtn" data-app="Cyber Game" style="float:right; background:cyan; border:none; padding:4px 12px; border-radius:20px;">Instalar</button></div>
          </div>
        </div>
      `;
    }
    if (appType === 'settings') {
      return `
        <div>
          <h3 style="color:cyan;">⚙️ CONFIGURAÇÕES CYBER</h3>
          <div style="margin-top:16px;">
            <div>🔋 <span id="settingsBattery">Bateria: ...</span></div>
            <div>🧠 Tema: Cyberpunk Neon</div>
            <div>🐧 Modo Fusion: Ativo</div>
            <div>📱 Interface Híbrida</div>
            <button id="testNotifyBtn" style="margin-top:16px; background:cyan; border:none; padding:8px; border-radius:28px;">🔔 Testar Notificação</button>
          </div>
        </div>
      `;
    }
    if (appType === 'calc') {
      return `
        <div class="calc-display" id="calcDisplayCyber">0</div>
        <div class="calc-buttons">
          <div class="calc-btn" data-val="7">7</div><div class="calc-btn" data-val="8">8</div><div class="calc-btn" data-val="9">9</div><div class="calc-btn" data-op="/">/</div>
          <div class="calc-btn" data-val="4">4</div><div class="calc-btn" data-val="5">5</div><div class="calc-btn" data-val="6">6</div><div class="calc-btn" data-op="*">*</div>
          <div class="calc-btn" data-val="1">1</div><div class="calc-btn" data-val="2">2</div><div class="calc-btn" data-val="3">3</div><div class="calc-btn" data-op="-">-</div>
          <div class="calc-btn" data-val="0">0</div><div class="calc-btn" id="calcClearCyber">C</div><div class="calc-btn" id="calcEqualCyber">=</div><div class="calc-btn" data-op="+">+</div>
        </div>
      `;
    }
    if (appType === 'finder') {
      return `
        <div>
          <h3>📁 FINDER FUSION</h3>
          <div style="margin-top:12px; display:flex; flex-wrap:wrap; gap:14px;">
            <div>📄 Documentos</div><div>🖼️ Wallpapers</div><div>🎵 Músicas</div><div>💾 Apps</div><div>🐧 Linux FS</div>
          </div>
        </div>
      `;
    }
    return `<div>App em desenvolvimento</div>`;
  }

  // ==================== ABRIR APPS ====================
  function openApp(appType) {
    let title = '', icon = '', w = 400, h = 480;
    switch(appType) {
      case 'chrome': title = 'Chrome Cyber'; icon = 'https://cdn-icons-png.flaticon.com/512/6124/6124999.png'; w=420; h=520; break;
      case 'terminal': title = 'Terminal Linux'; icon = 'https://cdn-icons-png.flaticon.com/512/2997/2997922.png'; w=480; h=400; break;
      case 'store': title = 'Cyber Store'; icon = 'https://cdn-icons-png.flaticon.com/512/5968/5968705.png'; w=420; h=460; break;
      case 'settings': title = 'Config Cyber'; icon = 'https://cdn-icons-png.flaticon.com/512/2997/2997933.png'; w=380; h=420; break;
      case 'calc': title = 'Cyber Calc'; icon = 'https://cdn-icons-png.flaticon.com/512/3665/3665923.png'; w=360; h=460; break;
      case 'finder': title = 'Finder'; icon = 'https://cdn-icons-png.flaticon.com/512/1828/1828970.png'; w=380; h=400; break;
      default: return;
    }
    const content = getAppContent(appType);
    const win = createWindow(title, icon, content, w, h);
    
    // Configurar eventos específicos após janela criada
    setTimeout(() => {
      if (appType === 'terminal') {
        const input = document.getElementById('termInput');
        if (input) {
          input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
              const cmd = input.value;
              const output = document.getElementById('terminalOutput');
              if (cmd === 'help') output.innerText = 'Comandos: help, ls, cyber, windows, linux, mac, ios, fusion';
              else if (cmd === 'ls') output.innerText = 'Desktop/ Downloads/ Documents/';
              else if (cmd === 'cyber') output.innerText = '💀 CyberOS Fusion - Modo punk ativado';
              else if (cmd === 'windows') output.innerText = 'Windows 11 mode: GUI integrada';
              else if (cmd === 'linux') output.innerText = 'Kernel 6.1 - Arch + Ubuntu mix';
              else if (cmd === 'mac') output.innerText = 'macOS Sonoma style dock';
              else if (cmd === 'ios') output.innerText = 'iOS 17 status bar + gestures';
              else if (cmd === 'fusion') output.innerText = 'Fusion OS: Win+Linux+Mac+iOS';
              else output.innerText = `Comando inválido: ${cmd}`;
              input.value = '';
            }
          });
        }
      }
      if (appType === 'calc') {
        let calcVal = '0', prev = null, op = null;
        const disp = document.getElementById('calcDisplayCyber');
        const update = () => { if(disp) disp.innerText = calcVal; };
        document.querySelectorAll('.calc-btn[data-val]').forEach(btn => {
          btn.addEventListener('click', () => {
            const v = btn.getAttribute('data-val');
            calcVal = calcVal === '0' ? v : calcVal + v;
            update();
          });
        });
        document.querySelectorAll('.calc-btn[data-op]').forEach(btn => {
          btn.addEventListener('click', () => {
            prev = parseFloat(calcVal);
            op = btn.getAttribute('data-op');
            calcVal = '0';
          });
        });
        document.getElementById('calcClearCyber')?.addEventListener('click', () => {
          calcVal = '0'; prev = null; op = null; update();
        });
        document.getElementById('calcEqualCyber')?.addEventListener('click', () => {
          if (op &&
